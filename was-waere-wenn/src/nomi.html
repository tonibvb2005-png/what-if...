<!doctype html>
<html><head><meta charset="utf-8">

</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const HANDLE = '@nomi.wasware';
const EP_NAME = new URLSearchParams(location.search).get('ep') || 'schweiz';
document.write(`<script src="episodes/${EP_NAME}.js"><\/script>`);
if (!new URLSearchParams(location.search).has('estimate')) document.write(`<script src="episodes/${EP_NAME}.times.js" onerror=""><\/script>`);
</script>
<script>
const EP = window.EPISODE;
const F = 'Fredoka';

// =====================================================================
// helpers
// =====================================================================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const norm = w => w.toLowerCase().replace(/[^a-zäöüß0-9]/g, '');
const D2R = Math.PI / 180;
const dir = a => [Math.sin(a * D2R), Math.cos(a * D2R)]; // 0 = down, 90 = right, 180 = up

// =====================================================================
// timing  ([Anzeige|Aussprache], {pause})
// =====================================================================
const SCRIPT = EP.scenes, WORDS = [];
let DURATION = 0;
(function () {
  let t = 0, gi = 0; const real = window.WORD_TIMES;
  SCRIPT.forEach((s, si) => {
    s.a = t; let c = t + 0.2; s.words = [];
    const re = /\{([\d.]+)\}|\[([^|\]]+)\|([^\]]+)\](\S*)|(\S+)/g; let m;
    while ((m = re.exec(s.text))) {
      if (m[1]) { c += +m[1]; continue; }
      if (m[5] === '–') { c += 0.2; continue; }
      const disp = m[5] || (m[2] + m[4]), spoken = m[5] || (m[3] + m[4]);
      const letters = spoken.replace(/[^\p{L}0-9]/gu, '').length;
      const w = { text: disp, start: c, end: c + 0.065 + 0.046 * letters, scene: si };
      if (real && real[gi]) { w.start = real[gi].start; w.end = real[gi].end; }
      gi++; WORDS.push(w); s.words.push(w); c = w.end;
      if (/[.!?]$/.test(disp)) c += 0.3; else if (/:$/.test(disp)) c += 0.2; else if (/,$/.test(disp)) c += 0.12;
    }
    s.b = Math.max(c + (s.tail ?? 0.35), t + (s.min || 0));
    if (si === SCRIPT.length - 1) s.b += 0.8;
    t = s.b;
  });
  if (real) {  // with real audio: cut between scenes in the middle of the pause
    SCRIPT.forEach((s, i) => {
      const last = s.words[s.words.length - 1], next = SCRIPT[i + 1];
      if (i === 0) s.a = 0;
      if (next) { const nf = next.words[0].start; s.b = Math.max(last.end + 0.12, (last.end + nf) / 2 + 0.1); s.b = Math.min(s.b, nf - 0.02); next.a = s.b; }
      else s.b = last.end + 1.6;
    });
    t = SCRIPT[SCRIPT.length - 1].b;
  }
  DURATION = t;
})();
window.DURATION = DURATION;
function cue(s, word, n = 0) {
  if (word == null) return 0;
  const hits = s.words.filter(w => norm(w.text) === norm(word));
  const w = hits[n] || hits[0];
  if (!w) { console.log('CUE NOT FOUND: ' + word); return 0; }
  return w.start - s.a;
}
function activeWord(t) { for (const w of WORDS) if (t >= w.start && t < w.end) return w; return null; }

// =====================================================================
// text & stickers
// =====================================================================
function outlined(text, x, y, size, fill, opts = {}) {
  ctx.save(); ctx.font = `${opts.weight || 700} ${size}px ${F}`; ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.2; ctx.strokeStyle = opts.stroke || '#1a1030';
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y); ctx.restore();
}
function popText(segs, x, y, size, p) {
  if (p <= 0) return;
  ctx.save(); ctx.font = `700 ${size}px ${F}`;
  const ws = segs.map(s => ctx.measureText(s[0]).width), tot = ws.reduce((a, b) => a + b, 0);
  ctx.translate(x, y); const sc = easeBack(clamp(p)); ctx.scale(sc, sc); ctx.globalAlpha = clamp(p * 2);
  let cx = -tot / 2;
  segs.forEach((s, i) => { outlined(s[0], cx, 0, size, s[1], { align: 'left' }); cx += ws[i]; });
  ctx.restore();
}
function sticker(text, x, y, p, rot = -0.07, bg = '#ffd23f', fg = '#1a1030', size = 46) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot + Math.sin(p * 9) * 0.02 * (1 - clamp(p)));
  const sc = easeBack(clamp(p)); ctx.scale(sc, sc); ctx.globalAlpha = clamp(p * 2);
  ctx.font = `700 ${size}px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 56, h = size * 1.75;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.roundRect(-w / 2 + 7, -h / 2 + 9, w, h, 22); ctx.fill();
  ctx.fillStyle = bg; ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 22); ctx.fill(); ctx.stroke();
  ctx.fillStyle = fg; ctx.fillText(text, 0, 4); ctx.restore();
}
function emoji(e, x, y, size, alpha = 1, rot = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(e, 0, size * 0.05); ctx.restore();
}
function clockBadge(time, icon, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(540, 250); const sc = easeBack(clamp(p)); ctx.scale(sc, sc);
  ctx.font = `700 58px ${F}`; const w = ctx.measureText(time).width + 140, h = 96;
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.roundRect(-w / 2 + 5, -h / 2 + 7, w, h, 48); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 48); ctx.fill(); ctx.stroke();
  emoji(icon, -w / 2 + 56, 0, 52);
  ctx.fillStyle = '#1a1030'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(time, -w / 2 + 100, 4);
  ctx.restore();
}

// =====================================================================
// NOMI – the host. Orange hoodie, curl on top, star patch.
// =====================================================================
const NC = { hood: '#f07b3f', hoodDark: '#c9592a', jeans: '#2f4466', ink: '#1a1030', skin: '#ffffff', cheek: '#ff8fa3' };
const UA = 66, FA = 62, LEG = 150;
const POSE = {
  idle:    { L: [-12, -6], R: [12, 6] },
  present: { L: [-12, -6], R: [78, 45] },
  think:   { L: [-40, 95], R: [25, 152], brow: 1 },
  shrug:   { L: [-75, -85], R: [75, 85], brow: 1 },
  tada:    { L: [-140, -12], R: [140, 12] },
  stretch: { L: [-168, 8], R: [168, -8] },
  hips:    { L: [-45, 100], R: [45, -100] },
  watch:   { L: [-40, 132], R: [12, 6], brow: 1 },
  hold:    { L: [-12, -6], R: [40, 100] },
  cup:     { L: [-12, -6], R: [22, 138] },
  raise:   { L: [-20, 45], R: [176, 0] },
  sitdesk: { L: [-22, 75], R: [22, -75] },
  bench:   { L: [-28, -12], R: [28, 12] },
  lookL:   { L: [-95, -25], R: [12, 6], look: -1.6 },
  lookR:   { L: [-12, -6], R: [95, 25], look: 1.6 },
};
const FN_POSE = {
  wave: u => ({ L: [-12, -6], R: [150, 25 + 25 * Math.sin(u * 11)] }),
  eat: u => ({ L: [-22, 70], R: [24, 105 + 45 * Math.sin(u * 5)] }),
  munch: u => ({ L: [-12, -6], R: [24, 140 + 8 * Math.sin(u * 9)] }),
};
function blendPose(a, b, k) {
  return { L: [lerp(a.L[0], b.L[0], k), lerp(a.L[1], b.L[1], k)], R: [lerp(a.R[0], b.R[0], k), lerp(a.R[1], b.R[1], k)], brow: lerp(a.brow || 0, b.brow || 0, k), look: lerp(a.look || 0, b.look || 0, k) };
}
function nomiState(s, u, defPose, pointTarget) {
  const getPose = (name) => FN_POSE[name] ? FN_POSE[name](u) : name === 'point' ? pointAtPose(pointTarget) : (POSE[name] || POSE.idle);
  const keys = [[0, defPose || 'idle', null, null]];
  for (const [w, pose, prop, mouth] of (s.nomi || [])) keys.push([cue(s, w), pose, prop || null, mouth || null]);
  keys.sort((a, b) => a[0] - b[0]);
  let i = 0; while (i + 1 < keys.length && keys[i + 1][0] <= u) i++;
  const cur = getPose(keys[i][1]);
  const pose = i === 0 ? cur : blendPose(getPose(keys[i - 1][1]), cur, easeInOut(prog(u, keys[i][0], keys[i][0] + 0.3)));
  return { pose, prop: keys[i][2], propA: easeOut(prog(u, keys[i][0], keys[i][0] + 0.25)), expr: keys[i][3] || POSE_EXPR[keys[i][1]] || 'happy' };
}
let NOMI_POS = null; // filled per frame for pointing
function pointAtPose(target) {
  if (!target || !NOMI_POS) return POSE.present;
  const sx = NOMI_POS.x + 42 * NOMI_POS.scale, sy = NOMI_POS.hipY - 122 * NOMI_POS.scale;
  return { L: [-30, 60], R: [Math.atan2(target[0] - sx, target[1] - sy) / D2R, 0] };
}

function limb(pts, w, col) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p));
  ctx.strokeStyle = NC.ink; ctx.lineWidth = w + 9; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function star(x, y, r, col) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.38 : r; ctx.lineTo(x + Math.sin(a) * rr, y - Math.cos(a) * rr); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}

// ---------------------------------------------------------------------
// People: Nomi + side characters, all in the same cartoon style
// ---------------------------------------------------------------------
const EXPR = {
  happy:     { big: 1,    iris: 1,    lid: 0,    brow: [0, 0],     mouth: 'smile' },
  excited:   { big: 1.12, iris: 1,    lid: 0,    brow: [-8, -8],   mouth: 'grin', sparkle: true },
  surprised: { big: 1.22, iris: 0.72, lid: 0,    brow: [-13, -13], mouth: 'o' },
  thinking:  { big: 1,    iris: 1,    lid: 0.15, brow: [-10, 2],   mouth: 'side', lookX: 4, lookY: -4 },
  sleepy:    { big: 1,    iris: 1,    lid: 0.6,  brow: [4, 4],     mouth: 'yawn' },
  asleep:    { closed: true, down: true,         brow: [3, 3],     mouth: 'flat' },
  content:   { closed: true,                     brow: [-3, -3],   mouth: 'smile' },
  doubt:     { big: 1.05, iris: 0.9,  lid: 0,    brow: [-12, -3],  mouth: 'flat' },
  grumpy:    { big: 1,    iris: 1,    lid: 0.35, brow: [6, 6],     mouth: 'flat', angry: true },
};
const POSE_EXPR = { tada: 'excited', raise: 'excited', shrug: 'doubt', think: 'thinking', watch: 'thinking',
  bench: 'content', stretch: 'sleepy', wave: 'happy' };
const EXPR_ALIAS = { yawn: 'sleepy', wow: 'surprised' };
const HAIR = '#4a3226', HAIR_HI = '#7a5640', SKIN = '#f5c9a6', SKIN_D = '#d99a74';

const NOMI_STYLE = { nomi: true, skin: SKIN, hair: HAIR, hairStyle: 'nomi', top: '#f07b3f', topDark: '#c9592a', pants: '#2f4466', shoe: '#fff' };
// a small cast of side characters
const CAST = {
  mom:       { skin: '#e8b48f', hair: '#8a4b2a', hairStyle: 'long',  top: '#5cb8a8', pants: '#3b3b58' },
  dad:       { skin: '#f2c6a0', hair: '#2b2b2b', hairStyle: 'short', top: '#6f8fd8', pants: '#4a4a4a', glasses: true, beard: true },
  nurse:     { skin: '#a8714f', hair: '#1f1a17', hairStyle: 'bun',   top: '#8fd3c4', pants: '#8fd3c4', cap: 'nurse' },
  commuter:  { skin: '#f5d0b0', hair: '#3a2a20', hairStyle: 'short', top: '#2f3442', pants: '#2f3442', tie: '#c0392b' },
  commuter2: { skin: '#c68b62', hair: '#111',    hairStyle: 'curly', top: '#e6b422', pants: '#334' },
  conductor: { skin: '#f0c19c', hair: '#6b6b6b', hairStyle: 'short', top: '#1f3f7a', pants: '#1f3f7a', cap: 'conductor', mustache: true },
  teacher:   { skin: '#f3c9a8', hair: '#b8b8b8', hairStyle: 'bun',   top: '#9b59b6', pants: '#3b3b58', glasses: true },
  kid1:      { skin: '#8d5a3b', hair: '#1a1a1a', hairStyle: 'curly', top: '#ff6b6b', pants: '#2f4466' },
  kid2:      { skin: '#f6d3b3', hair: '#e0b04a', hairStyle: 'long',  top: '#6bcB77', pants: '#5b4b8a' },
  kid3:      { skin: '#d9a07a', hair: '#3b2416', hairStyle: 'short', top: '#4d96ff', pants: '#333', glasses: true },
  barista:   { skin: '#e0ac85', hair: '#c0392b', hairStyle: 'bun',   top: '#2d2d2d', pants: '#2d2d2d', apron: '#2f5d50' },
  guest:     { skin: '#f5d0b0', hair: '#555',    hairStyle: 'bald',  top: '#c97b4a', pants: '#3a3a3a', glasses: true, mustache: true },
  hiker:     { skin: '#f0c19c', hair: '#6b3e26', hairStyle: 'short', top: '#d35400', pants: '#5d4037', cap: 'beanie', backpack: true },
  opa:       { skin: '#f0c9a8', hair: '#e8e8e8', hairStyle: 'bald',  top: '#7f8c8d', pants: '#555', glasses: true, mustache: true },
  jogger:    { skin: '#6f4a33', hair: '#111',    hairStyle: 'short', top: '#ff4f8b', pants: '#222' },
  walker:    { skin: '#f6d3b3', hair: '#d8a24a', hairStyle: 'long',  top: '#5b8def', pants: '#444' },
};

function drawPerson(t, o, st, style = NOMI_STYLE) {
  const sc = o.scale || 1;
  const w = style.nomi ? activeWord(t) : null, talking = !!w;
  const ph = (o.phase || 0);
  const bob = o.walk ? Math.abs(Math.sin(t * 12 + ph)) * -6 : talking ? Math.sin(t * 9) * 3 : Math.sin(t * 2.2 + ph) * 2.5;
  const hipY = o.sit ? o.seatY : o.feet - LEG * sc;
  if (style.nomi) NOMI_POS = { x: o.x, hipY, scale: sc };
  ctx.save(); ctx.translate(o.x, hipY + bob * (o.sit ? 0.5 : 1)); ctx.scale((o.flip ? -1 : 1) * sc, sc);
  const pose = st.pose, ink = NC.ink;

  if (style.backpack) rrect(-46, -130, 92, 120, 22, '#2e7d32');
  // legs
  if (!o.hideLegs) {
    for (const side of [-1, 1]) {
      let pts;
      if (o.sit) pts = [[side * 18, 4], [side * 30, 34], [side * 34, 128]];
      else {
        const sw = o.walk ? Math.sin(t * 12 + ph) * 24 * side : 0;
        const [dx, dy] = dir(sw + side * 5);
        pts = [[side * 18, 4], [side * 18 + dx * LEG, 4 + dy * LEG]];
      }
      limb(pts, 24, style.pants);
      const f = pts[pts.length - 1];
      ctx.beginPath(); ctx.ellipse(f[0] + side * 12, f[1] + 8, 28, 14, 0, 0, 7);
      ctx.fillStyle = style.shoe || '#3b2a20'; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 5; ctx.stroke();
      if (style.nomi) { ctx.beginPath(); ctx.moveTo(f[0] + side * 12 - 14, f[1] + 12); ctx.lineTo(f[0] + side * 12 + 14, f[1] + 12); ctx.strokeStyle = style.top; ctx.lineWidth = 4; ctx.stroke(); }
    }
  }
  // torso
  if (style.nomi) { ctx.beginPath(); ctx.ellipse(0, -136, 46, 24, 0, 0, 7); ctx.fillStyle = style.topDark; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 5; ctx.stroke(); }
  ctx.beginPath(); ctx.roundRect(-50, -138, 100, 150, [34, 34, 20, 20]);
  ctx.fillStyle = style.top; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 5; ctx.stroke();
  if (style.nomi) {
    ctx.beginPath(); ctx.roundRect(-32, -42, 64, 34, 12); ctx.strokeStyle = style.topDark; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, -128); ctx.lineTo(-14, -94); ctx.moveTo(12, -128); ctx.lineTo(14, -94); ctx.stroke();
    star(-28, -98, 13, '#ffd23f');
  } else {
    ctx.beginPath(); ctx.moveTo(-20, -138); ctx.lineTo(0, -110); ctx.lineTo(20, -138); ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 4; ctx.stroke();
    if (style.tie) { ctx.beginPath(); ctx.moveTo(-6, -128); ctx.lineTo(6, -128); ctx.lineTo(9, -80); ctx.lineTo(0, -70); ctx.lineTo(-9, -80); ctx.closePath(); ctx.fillStyle = style.tie; ctx.fill(); }
    if (style.apron) { ctx.beginPath(); ctx.roundRect(-38, -96, 76, 108, 10); ctx.fillStyle = style.apron; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.stroke(); }
    if (style.cap === 'conductor') { ctx.fillStyle = '#ffd23f'; for (const by of [-90, -55, -20]) { ctx.beginPath(); ctx.arc(0, by, 5, 0, 7); ctx.fill(); } }
  }
  // arms
  for (const side of ['L', 'R']) {
    const sx = side === 'L' ? -42 : 42, sy = -120;
    const [a, e] = pose[side];
    const [d1x, d1y] = dir(a), [d2x, d2y] = dir(a + e);
    const ex = sx + d1x * UA, ey = sy + d1y * UA, hx = ex + d2x * FA, hy = ey + d2y * FA;
    limb([[sx, sy], [ex, ey], [hx, hy]], 20, style.top);
    ctx.beginPath(); ctx.arc(hx, hy, 12, 0, 7); ctx.fillStyle = style.skin; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.stroke();
    if (side === 'R' && st.prop) { ctx.save(); if (o.flip) ctx.scale(-1, 1); emoji(st.prop, (o.flip ? -1 : 1) * (hx + 4), hy - 30, 78, st.propA ?? 1); ctx.restore(); }
  }
  // head
  const tilt = (talking ? Math.sin(t * 3.1) * 0.05 : Math.sin(t * 1.3 + ph) * 0.03) + (pose.look || 0) * 0.08;
  ctx.save(); ctx.translate(0, -200); ctx.rotate(tilt);
  drawFace(t, st.expr || 'happy', w, (o.look || 0) + (pose.look || 0), style, ph);
  ctx.restore();
  ctx.restore();
}
function drawNomi(t, o, st) { drawPerson(t, o, st, NOMI_STYLE); }

// side character with a named pose (or pose function) and expression
function npc(t, role, o) {
  const pose = typeof o.pose === 'function' ? o.pose(t) : FN_POSE[o.pose] ? FN_POSE[o.pose](t + (o.phase || 0)) : (POSE[o.pose] || POSE.idle);
  ctx.save(); drawPerson(t, o, { pose, prop: o.prop, propA: 1, expr: o.expr || 'happy' }, CAST[role]); ctx.restore();
}

function hairBack(style) {
  const hs = style.hairStyle; ctx.fillStyle = style.hair; ctx.strokeStyle = NC.ink; ctx.lineWidth = 5;
  if (hs === 'nomi' || hs === 'short' || hs === 'bun') { ctx.beginPath(); ctx.ellipse(0, -6, 62, 60, 0, Math.PI * 0.93, Math.PI * 2.07); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  if (hs === 'long') { ctx.beginPath(); ctx.roundRect(-66, -58, 132, 140, [60, 60, 26, 26]); ctx.fill(); ctx.stroke(); }
  if (hs === 'curly') { ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = Math.PI * (0.9 + i * 0.15); ctx.moveTo(Math.cos(a) * 52 + 22, Math.sin(a) * 52 - 4); ctx.arc(Math.cos(a) * 52, Math.sin(a) * 52 - 4, 22, 0, 7); } ctx.fill(); ctx.stroke(); }
  if (hs === 'bun') { ctx.beginPath(); ctx.arc(0, -70, 24, 0, 7); ctx.fill(); ctx.stroke(); }
}
function hairFront(style) {
  const hs = style.hairStyle; ctx.fillStyle = style.hair; ctx.strokeStyle = NC.ink; ctx.lineWidth = 4.5;
  if (hs === 'nomi') {
    ctx.beginPath(); ctx.moveTo(-55, -2);
    ctx.bezierCurveTo(-63, -50, -30, -74, 2, -69); ctx.bezierCurveTo(38, -73, 64, -46, 55, -6);
    ctx.quadraticCurveTo(50, -24, 40, -29); ctx.quadraticCurveTo(35, -16, 24, -18); ctx.quadraticCurveTo(18, -35, 6, -34);
    ctx.quadraticCurveTo(-1, -19, -12, -21); ctx.quadraticCurveTo(-18, -37, -31, -33); ctx.quadraticCurveTo(-40, -20, -48, -20);
    ctx.quadraticCurveTo(-52, -12, -55, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, -68); ctx.quadraticCurveTo(-4, -88, 14, -86); ctx.quadraticCurveTo(4, -78, 8, -68); ctx.closePath(); ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = HAIR_HI; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-34, -52); ctx.quadraticCurveTo(-12, -63, 14, -59); ctx.stroke();
  } else if (hs === 'short' || hs === 'bun') {
    ctx.beginPath(); ctx.moveTo(-54, -8); ctx.bezierCurveTo(-60, -60, 60, -60, 54, -8);
    ctx.quadraticCurveTo(30, -36, 0, -36); ctx.quadraticCurveTo(-30, -36, -54, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (hs === 'long') {

    const g = ctx.createLinearGradient(0, 1080, 0, 1330); g.addColorStop(0, '#ff9a6b'); g.addColorStop(1, '#2a2160'); ctx.fillStyle = g; ctx.fillRect(0, 1080, W, 250);
    for (let i = 0; i < 9; i++) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; const y = 1100 + i * 26; ctx.fillRect(300 + Math.sin(u * 2 + i) * 30 - i * 10, y, 300 + i * 20, 4); }
    ctx.fillStyle = '#2d5a3d'; ctx.fillRect(0, 1320, W, H);
    // lamp
    ctx.strokeStyle = NC.ink; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(900, 1460); ctx.lineTo(900, 1000); ctx.stroke();
    const lg = ctx.createRadialGradient(900, 990, 5, 900, 990, 160); lg.addColorStop(0, 'rgba(255,230,150,0.8)'); lg.addColorStop(1, 'rgba(255,230,150,0)'); ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(900, 990, 160, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(900, 990, 24, 0, 7); ctx.fillStyle = '#fff1b0'; ctx.fill(); ctx.stroke();
    emoji('🦢', 300 + u * 25, 1170 + Math.sin(u * 2) * 4, 60);
    npc(u, 'walker', { x: lerp(-150, 1250, (u / 9) % 1), feet: 1330, scale: 0.5, walk: true, pose: 'idle', expr: 'happy', phase: 0.2 });
    emoji('🐕', lerp(-150, 1250, (u / 9) % 1) + 60, 1310, 50);
    npc(u, 'jogger', { x: lerp(1250, -150, ((u + 3) / 4) % 1), feet: 1330, scale: 0.5, walk: true, flip: true, pose: 'hips', expr: 'content', phase: 2.5 });
    // bench back
    rrect(250, 1240, 580, 26, 6, '#8a5a3b'); rrect(250, 1280, 580, 26, 6, '#8a5a3b');
    for (let i = 0; i < 5; i++) { const fx = 100 + ((i * 197 + u * 30) % 880), fy = 1400 + Math.sin(u * 2 + i) * 40; ctx.beginPath(); ctx.arc(fx, fy, 5, 0, 7); ctx.fillStyle = `rgba(255,240,120,${0.5 + 0.5 * Math.sin(u * 5 + i)})`; ctx.fill(); }
    return { nomi: { x: 540, sit: true, seatY: 1350 }, front() {
      rrect(230, 1350, 620, 34, 8, '#a06b45');
      ctx.strokeStyle = NC.ink; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(280, 1384); ctx.lineTo(280, 1500); ctx.moveTo(800, 1384); ctx.lineTo(800, 1500); ctx.stroke();
    }, stick: [[540, 560]] };
  },

  outro(u, s) {
    casinoBg(u);
    popText([['Wo werde ich', '#fff']], 540, 330, 90, prog(u, 0.1, 0.5));
    popText([['morgen geboren?', '#ffd23f']], 540, 440, 90, prog(u, 0.3, 0.7));
    reel(u, s, 0, true);
    const tS = cue(s, 'schreib');
    sticker('⬇️ Dein Land in die Kommentare!', 440, 1160, prog(u, tS, tS + 0.4), -0.04, '#ff4f8b', '#fff', 40);
    return { nomi: { x: 880, feet: 1500, scale: 0.9 } };
  },
};

// =====================================================================
// subtitles (karaoke)
// =====================================================================
let CHUNKS = null;
function buildChunks() {
  ctx.font = `700 62px ${F}`; const MAXW = 860, MAXN = 4;
  const width = ws => ctx.measureText(ws.map(w => w.text).join(' ')).width;
  const split = ws => {
    for (let k = 1; k <= ws.length; k++) {
      let best = null, bm = 1e9;
      const rec = (i, parts) => {
        if (parts.length === k - 1) { const last = ws.slice(i); if (!last.length) return; const all = [...parts, last];
          if (all.some(p => p.length > MAXN || width(p) > MAXW)) return; const m = Math.max(...all.map(width)); if (m < bm) { bm = m; best = all; } return; }
        for (let j = i + 1; j < ws.length; j++) rec(j, [...parts, ws.slice(i, j)]);
      };
      rec(0, []); if (best) return best;
    }
    return ws.map(w => [w]);
  };
  CHUNKS = [];
  for (const s of SCRIPT) { let sent = []; for (const w of s.words) { sent.push(w); if (/[.!?:]$/.test(w.text)) { CHUNKS.push(...split(sent)); sent = []; } } if (sent.length) CHUNKS.push(...split(sent)); }
}
function drawSubtitles(t) {
  if (!CHUNKS) buildChunks();
  const cx = 540, cy = 1610;
  for (let i = 0; i < CHUNKS.length; i++) {
    const ch = CHUNKS[i], nx = CHUNKS[i + 1];
    const a = ch[0].start - 0.05, b = Math.min(ch[ch.length - 1].end + 0.45, nx ? nx[0].start - 0.05 : 1e9);
    if (t < a || t >= b) continue;
    const p = prog(t, a, a + 0.15);
    ctx.save(); ctx.font = `700 62px ${F}`; ctx.textBaseline = 'middle';
    const sp = ctx.measureText(' ').width + 6, ws = ch.map(w => ctx.measureText(w.text).width);
    let x = cx - (ws.reduce((s, v) => s + v, 0) + sp * (ch.length - 1)) / 2;
    ctx.globalAlpha = p;
    ch.forEach((w, j) => {
      const on = t >= w.start && t < w.end + 0.05;
      const sc = on ? 1 + 0.08 * easeBack(prog(t, w.start, w.start + 0.12)) : 1;
      ctx.save(); ctx.translate(x + ws[j] / 2, cy + (1 - easeOut(p)) * 25); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 14; ctx.strokeStyle = NC.ink; ctx.strokeText(w.text, 0, 0);
      ctx.fillStyle = on ? '#ffd23f' : '#fff'; ctx.fillText(w.text, 0, 0); ctx.restore();
      x += ws[j] + sp;
    });
    ctx.restore();
  }
}

// =====================================================================
// main render
// =====================================================================
function iris(r, cx = 540, cy = 1050) {
  if (r >= 1400) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(cx, cy, Math.max(r, 0), 0, 7, true); ctx.fillStyle = '#120a24'; ctx.fill('evenodd'); ctx.restore();
}
const toMin = x => { const m = /^(\d\d):(\d\d)$/.exec(x || ''); return m ? +m[1] * 60 + +m[2] : null; };
const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
function badgeTime(s, u) {
  let cur = s.time2 && s._late ? s.time2 : s.time;
  const si = SCRIPT.indexOf(s), prev = SCRIPT.slice(0, si).reverse().find(x => x.time);
  const a = toMin(prev && (prev.time2 || prev.time)), b = toMin(s.time);
  if (a != null && b != null && u < 0.7 && !(s.time2 && s._late)) cur = fmt(lerp(a, b, easeInOut(prog(u, 0, 0.7))));
  return cur;
}

function drawScene(s, u, t, xoff) {
  const dur = s.b - s.a;
  ctx.save(); ctx.beginPath(); ctx.rect(xoff, 0, W, H); ctx.clip();
  // camera: slow push-in + optional comedic zoom
  let zp = 0, tx = 540, ty = 1000;
  if (s.zoom) { const tz = cue(s, s.zoom); zp = easeOut(prog(u, tz - 0.1, tz + 0.25)); [tx, ty] = s.zoomAt || [400, 1110]; }
  // fast editing: hard cut between wide and close shot on every new sentence
  let close = 0;
  if (!s.noCuts && !['roulette', 'outro'].includes(s.type)) {
    let n = 0; s.words.forEach((w, i) => { if (i > 0 && /[.!?:]$/.test(s.words[i - 1].text) && u >= w.start - s.a) n++; });
    close = n % 2;
  }
  const np = s._np || [540, 1150];
  const cz = close ? 1.42 : 1, cx0 = close ? clamp(np[0], 380, 700) : 540, cy0 = close ? np[1] : 1000;
  const z = (1 + 0.03 * (u / dur)) * cz * lerp(1, 2.8 / cz, zp);
  ctx.save();
  ctx.translate(540 + xoff, 1000); ctx.scale(z, z); ctx.translate(-lerp(cx0, tx, zp), -lerp(cy0, ty, zp));
  const r = SCENES[s.type](u, s) || {};
  if (r.nomi) {
    const st = nomiState(s, u, r.nomi.sit ? (r.nomi.hideLegs ? 'sitdesk' : 'bench') : 'idle', r.point);
    ctx.save(); drawNomi(t, r.nomi, st); ctx.restore();
    s._np = [NOMI_POS.x, NOMI_POS.hipY - 130];
  }
  if (r.front) { ctx.save(); r.front(); ctx.restore(); }
  ctx.restore();
  ctx.translate(xoff, 0);
  if (s.time) clockBadge(badgeTime(s, u), s.icon, prog(u, 0.05, 0.35));
  if (zp < 0.5) (s.stickers || []).forEach((st, i) => {
    const pos = (r.stick || [])[i] || [540, 520 + i * 130];
    const tt = cue(s, st.cue); sticker(st.text, pos[0], pos[1], prog(u, tt, tt + 0.35), i % 2 ? 0.06 : -0.06);
  });
  ctx.restore();
}

const TR = 0.4;
window.render = function (t) {
  let i = SCRIPT.findIndex(s => t >= s.a && t < s.b); if (i < 0) i = SCRIPT.length - 1;
  const s = SCRIPT[i];
  let A = null, B = null, k = 0;
  if (i < SCRIPT.length - 1 && t > s.b - TR / 2) { A = s; B = SCRIPT[i + 1]; k = (t - (s.b - TR / 2)) / TR; }
  else if (i > 0 && t < s.a + TR / 2) { A = SCRIPT[i - 1]; B = s; k = (t - (s.a - TR / 2)) / TR; }
  if (A) {
    const e = easeInOut(clamp(k));
    drawScene(A, t - A.a, t, -e * W);
    drawScene(B, Math.max(0, t - B.a), t, (1 - e) * W);
    const a = Math.sin(clamp(k) * Math.PI) * 0.5, r = rng(Math.floor(t * 30) + 3);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    for (let n = 0; n < 18; n++) ctx.fillRect(r() * W, r() * H, 200 + r() * 400, 4 + r() * 6);
  } else drawScene(s, t - s.a, t, 0);
  drawSubtitles(t);
  ctx.font = `600 34px ${F}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.strokeText(HANDLE, 50, 120); ctx.fillStyle = '#fff'; ctx.fillText(HANDLE, 50, 120);
  ctx.textAlign = 'right'; ctx.strokeText('Tag ' + EP.day, W - 50, 120); ctx.fillText('Tag ' + EP.day, W - 50, 120);
};

window.ready = (async () => {
  for (const w of [500, 600, 700]) {
    const ff = new FontFace(F, `url(fredoka-latin-${w}-normal.woff2)`, { weight: String(w) });
    await ff.load(); document.fonts.add(ff);
  }
  render(0);
  return DURATION;
})();
</script>
