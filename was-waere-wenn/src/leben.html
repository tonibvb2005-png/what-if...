<script>
// =====================================================================
// "Wo wirst du diesmal geboren?" – life-story engine
// An episode = list of beats (one spoken sentence each) + country shots.
// =====================================================================
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = 'Fredoka';

</script>
<script>
// ---------------- helpers ----------------

  orange: '#f4a62a', yellow: '#ffcf3f', red: '#d23c2c', cream: '#fbf6ea' };

// ---------------- timing ----------------
const EP = window.EPISODE, BEATS = EP.beats, WORDS = [];
let DURATION = 0;
(function () {

  BEATS.forEach((b, bi) => {
    b.words = []; let c = t;
    const re = /\[([^|\]]+)\|([^\]]+)\](\S*)|(\S+)/g; let m;
    while ((m = re.exec(b.say))) {

window.DURATION = DURATION;

// =====================================================================
// SCENERY PRIMITIVES (flat, warm, simple)

// =====================================================================
// OVERLAYS: headline, fact card, pills, stamp, age, caption
// =====================================================================
function headline(s, p) { if (!s || p <= 0) return; ctx.save(); ctx.translate(540, 230); const sc = 0.85 + 0.15 * easeBack(clamp(p)); ctx.scale(sc, sc); ctx.globalAlpha = clamp(p * 3);

  ctx.font = `700 ${o.size || 40}px ${F}`; const w = ctx.measureText(s).width + 40, h = (o.size || 40) * 1.5;

function ageTag(s, p) { if (!s || p <= 0) return; ctx.save(); ctx.translate(880, 400); ctx.rotate(-0.05); ctx.globalAlpha = clamp(p * 3); txt(s, 0, 0, 72, PAL.orange, { stroke: '#5b3b1d', lw: 12 }); ctx.restore(); }

// =====================================================================
// GLOBE intro / outro
// =====================================================================
const countries = topojson.feature(WORLD, WORLD.objects.countries).features;
const sphere = { type: 'Sphere' };
const STARS = []; { const r = rng(9); for (let i = 0; i < 140; i++) STARS.push([r() * W, r() * H, r() * 2 + 0.6]); }
function globeShot(t, o) {
  ctx.fillStyle = '#1d2b4f'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r] of STARS) { ctx.globalAlpha = 0.5 + 0.4 * Math.sin(t * 2 + x); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;

  const target = EP.center;
  const lon = lerp(o.spinLon, target[0], easeInOut(o.rotK || 0)), lat = lerp(15, target[1], easeInOut(o.rotK || 0));
  const R = lerp(330, 2600, easeInOut(k)), cy = lerp(1020, 1180, easeInOut(k));

  ctx.beginPath(); path(sphere); ctx.fillStyle = '#4b8fcf'; ctx.fill();

  for (const f of countries) { if (f.id === EP.isoId && (o.hl || 0) > 0) { ctx.beginPath(); path(f); ctx.fillStyle = `rgba(240,140,50,${o.hl})`; ctx.fill(); } }

  ctx.strokeStyle = PAL.red; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 56); ctx.stroke();
  ctx.beginPath(); ctx.arc(px, py - 70, 20, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();

function clouds(k) { // 0 → 1 → 0 cloud wipe

    const side = i % 2 ? 1 : -1, y = r() * H, size = 220 + r() * 220;

// paper grain
const GRAIN = document.createElement('canvas'); GRAIN.width = 540; GRAIN.height = 960;
{ const g = GRAIN.getContext('2d'), id = g.createImageData(540, 960), r = rng(77);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; } g.putImageData(id, 0, 0); }

// =====================================================================
// RENDER

const G = { ctx, W, H, INK, PAL, person, room, rrect, emoji, txt, skyBg, ground, mountains, chalet, flag, tree, fir, particles,

const SHOTS = EP.shots(G);

window.ready = (async () => {

  render(0); return DURATION;
})();
window.EVENTS = () => BEATS.map(b => ({ a: b.a, b: b.b, shot: b.shot, g0: b.g0, s0: b.s0, s1: b.s1, card: !!b.card, pill: b.pill ? (b.pill.at ?? 0.5) : null, stamp: b.stamp ? (b.stamp.at ?? 0.8) : null, bubble: b.bubble ? (b.bubble.at ?? 0.2) : null, sfx: b.sfx || [], clouds: !!b.clouds }));
</script>
