// =====================================================================

<script>

function rrect(x, y, w, h, r, fill, stroke = INK, lw = 4) {

// ---------------- timing ----------------
const EP = window.EPISODE, BEATS = EP.beats, WORDS = [];
let DURATION = 0;
(function () {
  const real = window.WORD_TIMES; let t = 0.15, gi = 0;
  BEATS.forEach((b, bi) => {
    b.words = []; let c = t;
    const re = /\[([^|\]]+)\|([^\]]+)\](\S*)|(\S+)/g; let m;
    while ((m = re.exec(b.say))) {

      if (real && real[gi]) { w.start = real[gi].start; w.end = real[gi].end; }

})();
window.DURATION = DURATION;
function cueT(b, word, n = 0) { // local (shot-group) time of a word in this beat

// =====================================================================
