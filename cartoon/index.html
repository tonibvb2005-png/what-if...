<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #12062e;
    font-family: 'Inter Display', 'Inter', 'Noto Color Emoji', sans-serif; color: #fff; }
  canvas { position: absolute; left: 0; top: 0; }
  #gl { width: 1080px; height: 1920px; filter: saturate(1.15); }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .tag { position: absolute; top: 205px; left: 0; right: 0; text-align: center; }
  .tag span { display: inline-block; padding: 12px 30px; border-radius: 999px; background: #fff; color: #1b1035; font-weight: 900;
    font-size: 40px; letter-spacing: 3px; border: 6px solid #1b1035; box-shadow: 0 8px 0 #1b1035; }
  .cap { position: absolute; left: 40px; right: 40px; top: 300px; text-align: center; font-weight: 900; font-size: 88px; line-height: 1.12;
    text-transform: uppercase; letter-spacing: -1px; }
  .cap span { display: inline-block; margin: 0 12px; paint-order: stroke; -webkit-text-stroke: 16px #1b1035; }
  .cap span.on { color: #ffd400; }
  .title { position: absolute; left: 40px; right: 40px; top: 230px; text-align: center; }
  .title div { font-weight: 900; text-transform: uppercase; line-height: 1.02; paint-order: stroke; -webkit-text-stroke: 18px #1b1035;
    letter-spacing: -2px; white-space: nowrap; }
  .gold { color: #ffd400; }
  .sub { font-size: 50px !important; letter-spacing: 1px !important; margin-top: 16px; -webkit-text-stroke: 12px #1b1035 !important; }
  .phoneui { position: absolute; left: 190px; width: 700px; top: 420px; border-radius: 46px; background: #fff; color: #1b1035; border: 8px solid #1b1035;
    box-shadow: 0 14px 0 #1b1035; padding: 30px 36px; text-align: center; }
  .phoneui .who { font-weight: 800; font-size: 34px; letter-spacing: 3px; color: #7b5cff; }
  .phoneui .q { font-weight: 900; font-size: 64px; margin: 10px 0 22px; line-height: 1.05; }
  .phoneui .btns { display: flex; gap: 24px; justify-content: center; }
  .phoneui .b { flex: 1; padding: 20px 0; border-radius: 26px; font-weight: 900; font-size: 52px; border: 6px solid #1b1035; color: #fff; }
  .phoneui .y { background: #22c55e; } .phoneui .n { background: #ef3b5c; }
  .follow { display: inline-block; margin-top: 30px; padding: 22px 60px; border-radius: 999px; background: #fe2c55; font-weight: 900; font-size: 56px;
    border: 7px solid #1b1035; box-shadow: 0 10px 0 #1b1035; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="gl" width="540" height="960"></canvas>
<canvas id="c2d" width="1080" height="1920"></canvas>
<div id="ov"></div>
<script src="vendor/three.min.js"></script>
<script src="world3d.js"></script>
<script src="puppet.js"></script>
<script src="main.js"></script>
</body>
</html>
