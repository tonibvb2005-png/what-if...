<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="d3-array.min.js"></script>
<script src="d3-geo.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="data.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const HANDLE = '@geo.fakten';

// =====================================================================
// SCRIPT  (identical to the voice-over). Word times are estimated here;
// once the real ElevenLabs audio exists, window.WORD_TIMES can override them.
// =====================================================================
const SCRIPT = [
  { id: 'hook',   lead: 0.3, tail: 0.6, min: 3.4,
    text: 'Drei Geo-Fakten, die kaum jemand kennt!' },
  { id: 'africa', lead: 0.4, tail: 1.6,
    text: 'Fakt eins: Afrika ist riesig. Die USA, China und Indien passen zusammen hinein – und es bleibt sogar noch Platz übrig!' },
  { id: 'land',   lead: 0.4, tail: 1.8,
    text: 'Fakt zwei: Nur zwei Länder sind doppelt ohne Meer. Usbekistan hat keinen Meerzugang – und auch keiner seiner Nachbarn. Das andere Land: Liechtenstein!' },
  { id: 'france', lead: 0.4, tail: 2.2,
    text: 'Fakt drei: Welches Land hat die meisten Zeitzonen? Russland? Die USA? Nein – Frankreich! Dank seiner Überseegebiete sind es zwölf.' },
  { id: 'outro',  lead: 0.3, tail: 1.4,
    text: 'Welcher Fakt hat dich überrascht? Folg mir für mehr!' },
];

const norm = w => w.toLowerCase().replace(/[^a-zäöüß0-9-]/g, '');
const WORDS = [];   // {text, start, end, scene}
let DURATION = 0;
(function buildTiming() {
  let t = 0;
  SCRIPT.forEach((s, si) => {
    s.a = t; let c = t + s.lead; s.words = [];
    const toks = s.text.split(/\s+/);
    toks.forEach((tok) => {
      if (tok === '–') { c += 0.2; return; }
      const letters = tok.replace(/[^\p{L}0-9]/gu, '').length;
      const w = { text: tok, start: c, end: c + 0.08 + 0.052 * letters, scene: si };
      WORDS.push(w); s.words.push(w); c = w.end;
      if (/[.!?]$/.test(tok)) c += 0.3; else if (/[:]$/.test(tok)) c += 0.2; else if (/,$/.test(tok)) c += 0.12;
    });
    s.b = Math.max(c + s.tail, t + (s.min || 0));
    t = s.b;
  });
  DURATION = t;
})();
window.DURATION = DURATION;
// local start time of the n-th occurrence of a word inside a scene
function wt(s, word, n = 0) {
  const hits = s.words.filter(w => norm(w.text) === word);
  const w = hits[n] || hits[0];
  return w ? w.start - s.a : 0;
}

// ---------- palette ----------
const C = {
  bg1: '#070b1f', bg2: '#13214d', land: '#2a3b66', landStroke: '#0b1430',
  yellow: '#ffd23f', white: '#ffffff', pink: '#ff4f8b', cyan: '#38e1ff',
  green: '#5cf29a', orange: '#ff8c42', suit: '#1d1f2b', tie: '#e63946'
};

// ---------- data ----------
const countries = topojson.feature(WORLD, WORLD.objects.countries).features;
const byId = {}; countries.forEach(f => { if (f.id) byId[f.id] = f; });
const AFRICA_IDS = ['012','024','072','108','120','140','148','178','180','204','226','231','232','262','266','270','288','324','384','404','426','430','434','450','454','466','478','504','508','516','562','566','624','646','686','694','706','710','716','728','729','732','748','800','818','834','854','894','768','788','174','132','678','480','690'];
const africaSet = new Set(AFRICA_IDS);
const africa = countries.filter(f => africaSet.has(f.id) || f.properties.name === 'Somaliland');
const sphere = { type: 'Sphere' };
function largestPolygon(f) {
  if (f.geometry.type === 'Polygon') return f;
  let best = null, ba = -1;
  for (const p of f.geometry.coordinates) { const g = { type: 'Polygon', coordinates: p }; const a = d3.geoArea(g); if (a > ba) { ba = a; best = g; } }
  return { type: 'Feature', geometry: best };
}
const USA = largestPolygon(byId['840']), CHN = largestPolygon(byId['156']), IND = largestPolygon(byId['356']);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const stars = []; { let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 160; i++) stars.push([r() * W, r() * H, r() * 2.2 + .4, r() * 6.28]); }

function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, p] of stars) {
    ctx.globalAlpha = .25 + .35 * (0.5 + 0.5 * Math.sin(t * 2 + p));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function textLine(segs, x, y, size, opts = {}) {
  const p = opts.p === undefined ? 1 : opts.p; if (p <= 0) return;
  ctx.save(); ctx.font = `${opts.weight || 900} ${size}px Montserrat`; ctx.textBaseline = 'middle';
  const widths = segs.map(s => ctx.measureText(s[0]).width), total = widths.reduce((a, b) => a + b, 0);
  const s = opts.noPop ? 1 : easeBack(clamp(p));
  ctx.translate(x, y + (1 - clamp(p)) * 40); ctx.scale(s, s); ctx.globalAlpha = clamp(p * 1.5);
  let cx = -total / 2;
  segs.forEach((seg, i) => {
    ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.16; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(seg[0], cx, 0);
    ctx.fillStyle = seg[1] || C.white; ctx.fillText(seg[0], cx, 0); cx += widths[i];
  });
  ctx.restore();
}
function pill(label, x, y, p, color = C.pink, size = 44) {
  if (p <= 0) return;
  ctx.save(); ctx.font = `900 ${size}px Montserrat`; ctx.textBaseline = 'middle';
  const w = ctx.measureText(label).width + 64, h = size * 1.9;
  const s = easeBack(clamp(p)); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = clamp(p * 2);
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(label, 0, 3); ctx.restore();
}
function label(text, x, y, color, p, size = 38) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 2);
  ctx.font = `800 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  const yy = y + (1 - easeOut(clamp(p))) * 20;
  ctx.strokeText(text, x, yy); ctx.fillStyle = color; ctx.fillText(text, x, yy); ctx.restore();
}
function drawGlobe(proj, highlights = {}, opts = {}) {
  const path = d3.geoPath(proj, ctx);
  const [cx, cy] = proj.translate(), r = proj.scale();
  const glow = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.25);
  glow.addColorStop(0, 'rgba(56,140,255,0.35)'); glow.addColorStop(1, 'rgba(56,140,255,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, r * 1.25, 0, 7); ctx.fill();
  const og = ctx.createRadialGradient(cx - r * .35, cy - r * .35, r * .1, cx, cy, r);
  og.addColorStop(0, '#1d4b9e'); og.addColorStop(1, '#0a1d45');
  ctx.beginPath(); path(sphere); ctx.fillStyle = og; ctx.fill();
  for (const f of countries) {
    ctx.beginPath(); path(f); ctx.fillStyle = highlights[f.id] || (opts.dim ? '#223154' : C.land); ctx.fill();
    ctx.strokeStyle = C.landStroke; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.beginPath(); path(sphere); ctx.strokeStyle = 'rgba(120,180,255,0.6)'; ctx.lineWidth = 3; ctx.stroke();
}
function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(60, 70, W - 120, 10);
  ctx.fillStyle = C.yellow; ctx.fillRect(60, 70, (W - 120) * clamp(t / DURATION), 10);
  ctx.font = '700 34px Montserrat'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('🌍 ' + HANDLE, 60, 130); ctx.textAlign = 'start';
}

// =====================================================================
// HOST CHARACTER – stick figure in a suit
// =====================================================================
const FIG = { x: 180, y: 1440 };              // hip position
const SH = { L: [-46, -150], R: [46, -150] };  // shoulders relative to hip
const UA = 82, FA = 78;                        // upper arm / forearm length
const D2R = Math.PI / 180;
const dir = a => [Math.sin(a * D2R), Math.cos(a * D2R)]; // 0 = down, 90 = right, 180 = up

const POSE = {
  idle:    { L: [-14, -6], R: [14, 6] },
  hips:    { L: [-45, 100], R: [45, -100] },
  think:   { L: [-45, 100], R: [28, 150], brow: 1 },
  shrug:   { L: [-75, -85], R: [75, 85], brow: 1 },
  tada:    { L: [-135, -10], R: [135, 10] },
  present: { L: [-14, -6], R: [80, 40] },
};
const wave = u => ({ L: [-14, -6], R: [150, 25 + 25 * Math.sin(u * 11)] });
function pointAt(x, y) {
  const sx = FIG.x + SH.R[0], sy = FIG.y + SH.R[1];
  const a = Math.atan2(x - sx, y - sy) / D2R;
  return { L: [-30, 60], R: [a, 0] };
}
function blendPose(a, b, k) {
  return {
    L: [lerp(a.L[0], b.L[0], k), lerp(a.L[1], b.L[1], k)],
    R: [lerp(a.R[0], b.R[0], k), lerp(a.R[1], b.R[1], k)],
    brow: lerp(a.brow || 0, b.brow || 0, k),
  };
}
function poseAt(keys, u) {
  const ev = (p) => typeof p === 'function' ? p(u) : p;
  let i = 0; while (i + 1 < keys.length && keys[i + 1][0] <= u) i++;
  const cur = ev(keys[i][1]); if (i === 0) return cur;
  const prev = ev(keys[i - 1][1]);
  return blendPose(prev, cur, easeInOut(prog(u, keys[i][0], keys[i][0] + 0.3)));
}
function activeWord(t) { for (const w of WORDS) if (t >= w.start && t < w.end) return w; return null; }

function strokeLimb(pts, width) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = width + 9; ctx.stroke();
  ctx.strokeStyle = C.suit; ctx.lineWidth = width; ctx.stroke();
}

function drawHost(t, pose, o = {}) {
  const x = FIG.x + (o.dx || 0), y = FIG.y;
  const w = activeWord(t), talking = !!w;
  const bob = talking ? Math.sin(t * 9) * 3 : Math.sin(t * 2) * 2;
  ctx.save(); ctx.translate(x, y + bob);

  // legs + shoes
  const legSwing = o.walk ? Math.sin(t * 13) * 24 : 0;
  for (const [hx, sw] of [[-18, legSwing], [18, -legSwing]]) {
    const [dx, dy] = dir(sw + (hx < 0 ? -6 : 6));
    const fx = hx + dx * 160, fy = 8 + dy * 160;
    strokeLimb([[hx, 8], [fx, fy]], 26);
    ctx.beginPath(); ctx.ellipse(fx + (hx < 0 ? -12 : 12), fy + 8, 28, 13, 0, 0, 7);
    ctx.fillStyle = '#0c0c10'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
  }

  // jacket
  ctx.beginPath();
  ctx.moveTo(-50, -158); ctx.lineTo(50, -158); ctx.lineTo(46, 18); ctx.lineTo(4, 26); ctx.lineTo(-4, 26); ctx.lineTo(-46, 18); ctx.closePath();
  ctx.fillStyle = C.suit; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke();
  // shirt V
  ctx.beginPath(); ctx.moveTo(-24, -158); ctx.lineTo(24, -158); ctx.lineTo(0, -80); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  // lapels
  ctx.strokeStyle = '#4a4e66'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-24, -158); ctx.lineTo(-8, -72); ctx.moveTo(24, -158); ctx.lineTo(8, -72); ctx.stroke();
  // tie
  ctx.fillStyle = C.tie;
  ctx.beginPath(); ctx.moveTo(-9, -156); ctx.lineTo(9, -156); ctx.lineTo(5, -140); ctx.lineTo(-5, -140); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-5, -140); ctx.lineTo(5, -140); ctx.lineTo(10, -96); ctx.lineTo(0, -84); ctx.lineTo(-10, -96); ctx.closePath(); ctx.fill();
  // buttons + globe pin
  ctx.fillStyle = '#c9ccd8'; for (const by of [-50, -20]) { ctx.beginPath(); ctx.arc(0, by, 4, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(-30, -118, 8, 0, 7); ctx.fillStyle = '#3d7bff'; ctx.fill();
  ctx.strokeStyle = C.green; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(-30, -118, 8, -1, 1.2); ctx.stroke();

  // arms
  for (const side of ['L', 'R']) {
    const [sx, sy] = SH[side], [a, e] = pose[side];
    const [d1x, d1y] = dir(a), [d2x, d2y] = dir(a + e);
    const ex = sx + d1x * UA, ey = sy + d1y * UA, hx = ex + d2x * FA, hy = ey + d2y * FA;
    strokeLimb([[sx, sy], [ex, ey], [hx, hy]], 22);
    ctx.beginPath(); ctx.arc(hx, hy, 13, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();
  }

  // neck + head
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -170); ctx.lineTo(0, -158); ctx.stroke();
  const tilt = talking ? Math.sin(t * 3.1) * 0.05 : 0;
  ctx.save(); ctx.translate(0, -228); ctx.rotate(tilt);
  ctx.beginPath(); ctx.arc(0, 0, 58, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.stroke();
  // hair
  ctx.beginPath(); ctx.moveTo(-52, -22); ctx.quadraticCurveTo(-24, -80, 48, -32); ctx.quadraticCurveTo(8, -50, -52, -22); ctx.fillStyle = '#111'; ctx.fill();
  // eyes + glasses
  const blink = (t % 3.3) < 0.12;
  for (const ex of [-21, 21]) {
    ctx.beginPath();
    if (blink) { ctx.moveTo(ex - 7, 0); ctx.lineTo(ex + 7, 0); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.stroke(); }
    else { ctx.arc(ex, 0, 6.5, 0, 7); ctx.fillStyle = '#111'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(ex, 0, 17, 0, 7); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(4, -2); ctx.stroke();
  // brows
  const br = (pose.brow || 0) * 8;
  ctx.lineWidth = 5; ctx.beginPath();
  ctx.moveTo(-32, -26 - br); ctx.lineTo(-12, -28 - br * 1.3); ctx.moveTo(12, -28 - br * 1.3); ctx.lineTo(32, -26 - br); ctx.stroke();
  // mouth: lip-flap while a word is spoken
  if (talking) {
    const n = Math.max(1, Math.round(norm(w.text).length / 3));
    const open = Math.abs(Math.sin(prog(t, w.start, w.end) * Math.PI * n));
    ctx.beginPath(); ctx.ellipse(0, 30, 13, 3 + 12 * open, 0, 0, 7); ctx.fillStyle = '#2a0d12'; ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, 18, 18, 0.2 * Math.PI, 0.8 * Math.PI); ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

// =====================================================================
// SUBTITLES – karaoke style, current word highlighted
// =====================================================================
let CHUNKS = null;
function buildChunks() {
  ctx.font = '900 62px Montserrat';
  const MAXW = 720, MAXN = 4;
  const width = ws => ctx.measureText(ws.map(w => w.text).join(' ')).width;
  // split a sentence into the fewest chunks that fit, as evenly as possible
  const split = (ws) => {
    for (let k = 1; k <= ws.length; k++) {
      let best = null, bestMax = 1e9;
      const rec = (i, parts) => {
        if (parts.length === k - 1) {
          const last = ws.slice(i); if (!last.length) return;
          const all = [...parts, last];
          if (all.some(p => p.length > MAXN || width(p) > MAXW)) return;
          const m = Math.max(...all.map(width)); if (m < bestMax) { bestMax = m; best = all; }
          return;
        }
        for (let j = i + 1; j < ws.length; j++) rec(j, [...parts, ws.slice(i, j)]);
      };
      rec(0, []);
      if (best) return best;
    }
    return ws.map(w => [w]);
  };
  CHUNKS = [];
  for (const s of SCRIPT) {
    let sent = [];
    for (const w of s.words) { sent.push(w); if (/[.!?:]$/.test(w.text)) { CHUNKS.push(...split(sent)); sent = []; } }
    if (sent.length) CHUNKS.push(...split(sent));
  }
}
function drawSubtitles(t) {
  if (!CHUNKS) buildChunks();
  const cx = 640, cy = 1500;
  for (let i = 0; i < CHUNKS.length; i++) {
    const ch = CHUNKS[i], next = CHUNKS[i + 1];
    const a = ch[0].start - 0.05, b = Math.min(ch[ch.length - 1].end + 0.45, next ? next[0].start - 0.05 : 1e9);
    if (t < a || t >= b) continue;
    const p = prog(t, a, a + 0.15);
    ctx.save(); ctx.font = '900 62px Montserrat'; ctx.textBaseline = 'middle';
    const sp = ctx.measureText(' ').width + 8;
    const ws = ch.map(w => ctx.measureText(w.text).width);
    let x = cx - (ws.reduce((s, v) => s + v, 0) + sp * (ch.length - 1)) / 2;
    ctx.globalAlpha = p;
    ch.forEach((w, j) => {
      const on = t >= w.start && t < w.end + 0.05;
      const sc = on ? 1 + 0.08 * easeBack(prog(t, w.start, w.start + 0.12)) : 1;
      ctx.save(); ctx.translate(x + ws[j] / 2, cy + (1 - easeOut(p)) * 25); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 14; ctx.strokeStyle = '#000';
      ctx.strokeText(w.text, 0, 0); ctx.fillStyle = on ? C.yellow : (t >= w.end ? '#fff' : 'rgba(255,255,255,0.75)');
      ctx.fillText(w.text, 0, 0); ctx.restore();
      x += ws[j] + sp;
    });
    ctx.restore();
  }
}

// =====================================================================
// SCENES – each draws its visuals and returns the host's pose keyframes
// =====================================================================
function sceneHook(u, s) {
  const r = 330 * easeOut(prog(u, 0, 1));
  const proj = d3.geoOrthographic().scale(Math.max(r, 1)).translate([610, 1010]).rotate([-u * 35 + 20, -15]).clipAngle(90);
  drawGlobe(proj);
  textLine([['3 GEO-FAKTEN', C.yellow]], W / 2, 400, 112, { p: prog(u, 0.15, 0.6) });
  textLine([['die kaum jemand', C.white]], W / 2, 515, 70, { p: prog(u, 0.5, 0.9) });
  textLine([['kennt', C.white], [' 🤯', C.white]], W / 2, 605, 70, { p: prog(u, 0.7, 1.1) });
  return { keys: [[0, POSE.idle], [0.7, wave], [2.6, POSE.idle]], walk: u < 0.75, dx: -400 * (1 - easeOut(prog(u, 0, 0.75))) };
}

function sceneAfrica(u, s) {
  const S = 560, center = [600, 1070];
  const proj = d3.geoAzimuthalEqualArea().rotate([-19, -2]).scale(S).translate(center).clipAngle(100);
  const path = d3.geoPath(proj, ctx);
  const zoom = easeOut(prog(u, 0, 0.8));
  ctx.save(); ctx.translate(...center); ctx.scale(0.6 + 0.4 * zoom, 0.6 + 0.4 * zoom); ctx.translate(-center[0], -center[1]);
  ctx.globalAlpha = zoom;
  for (const f of countries) { if (africaSet.has(f.id)) continue; ctx.beginPath(); path(f); ctx.fillStyle = '#1b2850'; ctx.fill(); }
  ctx.beginPath(); africa.forEach(f => path(f)); ctx.fillStyle = C.orange; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; africa.forEach(f => { ctx.beginPath(); path(f); ctx.stroke(); });
  ctx.restore(); ctx.globalAlpha = 1;

  pill('FAKT #1', W / 2, 310, prog(u, 0.1, 0.5));
  const tA = wt(s, 'afrika');
  textLine([['Afrika ist ', C.white], ['RIESIG', C.orange]], W / 2, 430, 92, { p: prog(u, tA, tA + 0.4) });

  const drops = [
    { f: USA, c: [-98.5, 39.5], to: [4.5, 22], g: 0,  col: C.cyan,  name: 'USA',    t0: wt(s, 'usa') },
    { f: CHN, c: [103, 36],     to: [37, 5],   g: 90, col: C.pink,  name: 'CHINA',  t0: wt(s, 'china') },
    { f: IND, c: [79, 22],      to: [20, -20], g: 0,  col: C.green, name: 'INDIEN', t0: wt(s, 'indien') },
  ];
  for (const d of drops) {
    const p = prog(u, d.t0, d.t0 + 0.6); if (p <= 0) continue;
    const target = proj(d.to), e = easeBack(p);
    const tx = target[0], ty = lerp(target[1] - 700, target[1], e);
    const pth = d3.geoPath(d3.geoAzimuthalEqualArea().rotate([-d.c[0], -d.c[1], d.g]).scale(S).translate([tx, ty]), ctx);
    ctx.globalAlpha = clamp(p * 2) * 0.88; ctx.beginPath(); pth(d.f); ctx.fillStyle = d.col; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    label(d.name, tx, ty, '#fff', prog(u, d.t0 + 0.35, d.t0 + 0.7), 40);
  }

  const tP = wt(s, 'platz'), pb = prog(u, tP, tP + 0.5);
  if (pb > 0) {
    ctx.save(); ctx.globalAlpha = clamp(pb * 2);
    const x0 = 140, bw = 800, y0 = 545;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(x0 - 26, y0, bw + 52, 168, 26); ctx.fill();
    ctx.font = '800 30px Montserrat'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.fillText('Afrika', x0, y0 + 30); ctx.textAlign = 'right'; ctx.fillText('30,4 Mio km²', x0 + bw, y0 + 30); ctx.textAlign = 'left';
    ctx.fillStyle = C.orange; ctx.fillRect(x0, y0 + 50, bw * easeOut(pb), 20);
    ctx.fillStyle = '#fff'; ctx.fillText('USA + China + Indien', x0, y0 + 102); ctx.textAlign = 'right'; ctx.fillText('22,7 Mio km²', x0 + bw, y0 + 102); ctx.textAlign = 'left';
    let xx = x0; for (const [v, col] of [[9.8, C.cyan], [9.6, C.pink], [3.3, C.green]]) {
      const w = bw * v / 30.4 * easeOut(prog(u, tP + 0.3, tP + 1.0)); ctx.fillStyle = col; ctx.fillRect(xx, y0 + 122, w, 20); xx += w; }
    ctx.restore();
  }
  const tgt = n => { const p = proj(drops[n].to); return pointAt(p[0], p[1]); };
  return { keys: [[0, POSE.idle], [tA, POSE.present], [drops[0].t0, tgt(0)], [drops[1].t0, tgt(1)], [drops[2].t0, tgt(2)], [tP, POSE.tada], [tP + 1.4, POSE.hips]] };
}

function sceneLandlocked(u, s) {
  const tAnd = wt(s, 'andere');
  const r0 = tAnd - 0.2, r1 = tAnd + 1.3;
  const k = easeInOut(prog(u, r0, r1));
  const uz = [64, 41], li = [9.55, 47.15];
  const rot = [-lerp(uz[0], li[0], k), -lerp(uz[1], li[1], k)];
  const z1 = lerp(650, 1500, easeOut(prog(u, 0, 1)));
  const scale = k <= 0 ? z1 : lerp(1500, 7000, easeInOut(prog(u, r0, r1 + 0.3))) * (1 - Math.sin(k * Math.PI) * 0.55);
  const center = [600, 1040];
  const proj = d3.geoOrthographic().scale(scale).translate(center).rotate(rot).clipAngle(90);
  drawGlobe(proj, { '860': C.yellow, '398': C.cyan, '417': C.cyan, '762': C.cyan, '004': C.cyan, '795': C.cyan, '438': C.yellow, '756': C.cyan, '040': C.cyan }, { dim: true });

  pill('FAKT #2', W / 2, 310, prog(u, 0.1, 0.5), C.cyan);
  const tN = wt(s, 'nur'), tD = wt(s, 'doppelt');
  textLine([['Nur ', C.white], ['2 Länder', C.yellow], [' sind', C.white]], W / 2, 430, 78, { p: prog(u, tN, tN + 0.4) });
  textLine([['DOPPELT', C.cyan], [' ohne Meer', C.white]], W / 2, 530, 78, { p: prog(u, tD, tD + 0.4) });

  const tU = wt(s, 'usbekistan'), tNb = wt(s, 'nachbarn');
  if (k < 0.3) {
    ctx.save(); ctx.globalAlpha = 1 - k / 0.3;
    const p = proj(uz); label('USBEKISTAN', p[0], p[1] - 10, C.yellow, prog(u, tU, tU + 0.4), 46);
    const nb = [['Kasachstan', [68, 48.5]], ['Turkmenistan', [58, 38.8]], ['Afghanistan', [66, 33.5]], ['Kirgistan', [76, 42.6]], ['Tadschik.', [71.5, 38.6]]];
    nb.forEach(([n, ll], i) => { const q = proj(ll); label(n, q[0], q[1], '#fff', prog(u, tNb - 0.6 + i * 0.18, tNb - 0.2 + i * 0.18), 30); });
    ctx.restore();
  }
  if (k > 0.85) {
    const p = proj(li), a = prog(u, r1 - 0.2, r1 + 0.2);
    ctx.save(); ctx.globalAlpha = a;
    for (let i = 0; i < 3; i++) { const ph = ((u * 1.2 + i / 3) % 1);
      ctx.beginPath(); ctx.arc(p[0], p[1], 20 + ph * 110, 0, 7); ctx.strokeStyle = `rgba(255,210,63,${1 - ph})`; ctx.lineWidth = 6; ctx.stroke(); }
    ctx.restore();
    label('LIECHTENSTEIN', p[0], p[1] - 150, C.yellow, prog(u, r1, r1 + 0.4), 52);
    const sw = proj([8.2, 46.7]), at = proj([13.6, 47.6]);
    label('Schweiz', sw[0], sw[1] + 60, '#fff', prog(u, r1 + 0.3, r1 + 0.7), 34);
    label('Österreich', at[0], at[1], '#fff', prog(u, r1 + 0.5, r1 + 0.9), 34);
  }
  const uzP = d3.geoOrthographic().scale(1500).translate(center).rotate([-uz[0], -uz[1]])(uz);
  return { keys: [[0, POSE.idle], [tN, POSE.present], [tU, pointAt(...uzP)], [wt(s, 'keinen'), POSE.shrug], [tNb + 0.3, POSE.hips], [r1 - 0.3, pointAt(...center)], [r1 + 1.2, POSE.idle]] };
}

const FR = [
  ['−10', -17.6, -149.4, -50, 0], ['−9:30', -9.0, -139.5, 0, -42], ['−9', -23.1, -134.9, 30, 40], ['−8', 10.3, -109.2, 0, -42],
  ['−4', 16.2, -61.5, 0, -42], ['−3', 4.0, -53.0, 30, 38], ['+1', 46.6, 2.4, 0, -42], ['+3', -12.8, 45.2, -44, 0],
  ['+4', -21.1, 55.5, 44, 10], ['+5', -49.3, 69.5, 0, 40], ['+11', -21.3, 165.5, 0, -42], ['+12', -13.3, -176.2, 0, -42],
];
function sceneFrance(u, s) {
  const proj = d3.geoNaturalEarth1().fitExtent([[10, 700], [W - 10, 1250]], sphere);
  const path = d3.geoPath(proj, ctx);
  const tF = wt(s, 'frankreich'), tQ = wt(s, 'welches'), tR = wt(s, 'russland');
  ctx.globalAlpha = easeOut(prog(u, 0, 0.6));
  ctx.beginPath(); path(sphere); ctx.fillStyle = '#0d2350'; ctx.fill(); ctx.strokeStyle = 'rgba(120,180,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = -12; i < 12; i += 2) {
    ctx.beginPath(); path({ type: 'Polygon', coordinates: [[[i * 15 - 7.5, -89], [i * 15 + 7.5, -89], [i * 15 + 7.5, 89], [i * 15 - 7.5, 89], [i * 15 - 7.5, -89]].reverse()] });
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
  }
  for (const f of countries) { ctx.beginPath(); path(f); ctx.fillStyle = f.id === '250' && u > tF ? '#3d7bff' : C.land; ctx.fill(); }
  ctx.globalAlpha = 1;

  pill('FAKT #3', W / 2, 310, prog(u, 0.1, 0.5), C.green);
  if (u < tF) {
    textLine([['Welches Land hat', C.white]], W / 2, 420, 70, { p: prog(u, tQ, tQ + 0.4) });
    textLine([['die ', C.white], ['MEISTEN', C.yellow], [' Zeitzonen?', C.white]], W / 2, 515, 70, { p: prog(u, tQ + 0.3, tQ + 0.7) });
    textLine([['Russland? USA?', C.cyan]], W / 2, 620, 60, { p: prog(u, tR, tR + 0.4) });
  } else {
    textLine([['FRANKREICH!', '#5b95ff']], W / 2, 420, 110, { p: prog(u, tF, tF + 0.4) });
    const n = FR.filter((_, i) => u > tF + 0.4 + i * 0.32).length;
    textLine([[String(n), C.yellow], [n === 1 ? ' Zeitzone' : ' Zeitzonen', C.white]], W / 2, 540, 80, { p: prog(u, tF + 0.3, tF + 0.6), noPop: true });
  }
  const tEnd = tF + 0.4 + FR.length * 0.32;
  FR.forEach(([off, lat, lon, dx, dy], i) => {
    const p = prog(u, tF + 0.4 + i * 0.32, tF + 0.7 + i * 0.32); if (p <= 0) return;
    const [x, y] = proj([lon, lat]), r = 14 * easeBack(p);
    ctx.beginPath(); ctx.arc(x, y, r + 6, 0, 7); ctx.fillStyle = 'rgba(255,210,63,0.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = C.yellow; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
    label(off, x + dx, y + dy, '#fff', p, 30);
  });
  textLine([['Russland: 11  ·  USA: 11', 'rgba(255,255,255,0.85)']], W / 2, 635, 44, { p: prog(u, tEnd, tEnd + 0.4), weight: 800 });
  return { keys: [[0, POSE.idle], [tQ, POSE.think], [tR, POSE.shrug], [tF - 0.1, POSE.tada], [tF + 1.0, pointAt(600, 950)], [tEnd + 0.2, POSE.hips]] };
}

function sceneOutro(u, s) {
  const proj = d3.geoOrthographic().scale(320 * easeOut(prog(u, 0, 0.6)) + 1).translate([620, 1000]).rotate([-u * 40 - 10, -20]).clipAngle(90);
  drawGlobe(proj);
  const tW = wt(s, 'welcher'), tFo = wt(s, 'folg');
  textLine([['Welcher Fakt hat', C.white]], W / 2, 420, 70, { p: prog(u, tW, tW + 0.4) });
  textLine([['dich überrascht?', C.yellow]], W / 2, 515, 70, { p: prog(u, tW + 0.3, tW + 0.7) });
  pill('FOLGEN für mehr Geo-Fakten', 620, 1370, prog(u, tFo, tFo + 0.4), C.pink, 40);
  return { keys: [[0, POSE.idle], [tW, POSE.shrug], [tFo, wave]] };
}

const SCENE_FN = { hook: sceneHook, africa: sceneAfrica, land: sceneLandlocked, france: sceneFrance, outro: sceneOutro };

window.render = function (t) {
  background(t);
  const s = SCRIPT.find(s => t >= s.a && t < s.b) || SCRIPT[SCRIPT.length - 1];
  const u = t - s.a;
  ctx.save(); const host = SCENE_FN[s.id](u, s); ctx.restore();
  drawSubtitles(t);
  ctx.save(); drawHost(t, poseAt(host.keys, u), host); ctx.restore();
  const fin = 1 - prog(u, 0, 0.18), fout = prog(u, s.b - s.a - 0.18, s.b - s.a);
  const f = Math.max(s.a > 0 ? fin : 0, s.b < DURATION ? fout : 0);
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f * 0.85})`; ctx.fillRect(0, 0, W, H); }
  progressBar(t);
};

window.ready = (async () => {
  for (const w of [600, 800, 900]) {
    const ff = new FontFace('Montserrat', `url(montserrat-latin-${w}-normal.woff2)`, { weight: String(w) });
    await ff.load(); document.fonts.add(ff);
  }
  render(0);
  return DURATION;
})();
</script>
