<script>
let TL, GRAIN = [];
const SET_ASSETS = {};
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const outBack = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const noise = (t, s = 1) => Math.sin(t * 12.9898 * s + 78.233) * Math.sin(t * 3.17 * s + 1.3);
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const lerp3 = (p, q, k) => [0, 1, 2].map(i => lerp(p[i], q[i], k));

/* ------------------------------------------------ 2D-Figur (SVG, Einheiten = Meter, y nach unten = -Welt-y) */
const SKIN = '#e3e9ff', SHIRT = '#7c3347', SHIRT_HI = '#94405a', INK = '#11142a';
const DEFS = `<defs>
  <radialGradient id="headG" cx="42%" cy="34%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3e9ff"/><stop offset="1" stop-color="#aab7e8"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a9c8ff" stop-opacity=".5"/><stop offset="1" stop-color="#a9c8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9dffbd" stop-opacity=".45"/><stop offset="1" stop-color="#9dffbd" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#ffb35a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></radialGradient>
  <linearGradient id="lit" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bcd4ff" stop-opacity=".5"/><stop offset=".6" stop-color="#bcd4ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="shadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0a0c24" stop-opacity=".42"/></linearGradient>
  <radialGradient id="spec" cx="34%" cy="26%" r="22%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="cface" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#e9ecf7"/><stop offset=".7" stop-color="#c3c8de"/><stop offset="1" stop-color="#8a8fa8"/></radialGradient>
</defs>`;
const sv = (p) => [p[0], -p[1]];
const svgWrap = (cx, cy, S, body, px = 2048) => `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="${cx - S / 2} ${-(cy + S / 2)} ${S} ${S}">${DEFS}${body}</svg>`;

function head(c, r, o = {}) {
  const [cx, cy] = c;
  let eyes = o.eyes || 'open';
  if (eyes !== 'closed' && o.t !== undefined && (o.t % 3.7) < 0.11) eyes = 'closed';
  const lx = (o.look || 0) * r * 0.09, ex = r * 0.3, ey = cy - r * 0.04, er = r * (eyes === 'wide' ? 0.085 : 0.07);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#headG)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#shadeR)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#spec)"/>`;
  if (o.lit) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#lit)"/>`;
  if (eyes === 'closed') {
    for (const k of [-1, 1]) s += `<path d="M${cx + k * ex - er * 1.7} ${ey} Q${cx + k * ex} ${ey + er * 1.8} ${cx + k * ex + er * 1.7} ${ey}" stroke="${INK}" stroke-width="${r * .035}" fill="none" stroke-linecap="round"/>`;
  } else for (const k of [-1, 1]) {
    s += `<circle cx="${cx + k * ex + lx}" cy="${ey}" r="${er}" fill="${INK}"/>`;
    if (eyes === 'wide') s += `<circle cx="${cx + k * ex + lx + er * .35}" cy="${ey - er * .35}" r="${er * .32}" fill="#9fd8ff"/>`;
  }
  const my = cy + r * 0.32;
  if (o.mouth === 'o') s += `<ellipse cx="${cx + lx * .5}" cy="${my}" rx="${r * .055}" ry="${r * .04}" fill="${INK}"/>`;
  else s += `<path d="M${cx - r * .07} ${my} Q${cx} ${my - r * .025} ${cx + r * .07} ${my}" stroke="${INK}" stroke-width="${r * .028}" fill="none" stroke-linecap="round"/>`;
  return s;
}
function torso(cx, top, w, h) {
  const a = w * .09, b = w * .28, c = w * .065;
  return `<path d="M${cx - w / 2 + a} ${top} Q${cx} ${top - a} ${cx + w / 2 - a} ${top} Q${cx + w / 2 + a * .5} ${top + a * .7} ${cx + w / 2} ${top + b} L${cx + w / 2 - c} ${top + h} L${cx - w / 2 + c} ${top + h} L${cx - w / 2} ${top + b} Q${cx - w / 2 - a * .5} ${top + a * .7} ${cx - w / 2 + a} ${top} Z" fill="${SHIRT}"/>
    <path d="M${cx - w / 2 + a} ${top} Q${cx} ${top - a} ${cx + w / 2 - a} ${top} Q${cx + w / 2 + a * .5} ${top + a * .7} ${cx + w / 2} ${top + b} L${cx + w / 2 - c} ${top + h} L${cx - w / 2 + c} ${top + h} L${cx - w / 2} ${top + b} Q${cx - w / 2 - a * .5} ${top + a * .7} ${cx - w / 2 + a} ${top} Z" fill="url(#shadeR)"/>
    <path d="M${cx - w * .17} ${top - w * .02} Q${cx} ${top + w * .13} ${cx + w * .17} ${top - w * .02}" stroke="${SHIRT_HI}" stroke-width="${w * .055}" fill="none" stroke-linecap="round"/>`;
}
function arm(s, h, bend = 1) {
  const mx = (s[0] + h[0]) / 2, my = (s[1] + h[1]) / 2, dx = h[0] - s[0], dy = h[1] - s[1], L = Math.hypot(dx, dy) || 1;
  const off = Math.min(.07, L * .28) * bend, c = [mx - dy / L * off, my + dx / L * off];
  return `<path d="M${s[0]} ${s[1]} Q${c[0]} ${c[1]} ${h[0]} ${h[1]}" stroke="${SKIN}" stroke-width=".026" fill="none" stroke-linecap="round"/><circle cx="${h[0]}" cy="${h[1]}" r=".02" fill="${SKIN}"/>`;
}

// Figur im Bett. Welt-Koordinaten (Meter). PZ = Tiefe der Figuren-Ebene.
const PZ = .62, HOLD = [.15, .93];
function character(st) {
  const hip = [.15, .6], dyH = (1 - st.sit) * .37, dyT = (1 - st.sit) * .47, ang = .45 * (st.lean || 0);
  const R = (p) => { const x = p[0] - hip[0], y = p[1] - hip[1], c = Math.cos(ang), s = Math.sin(ang); return [hip[0] + x * c - y * s, hip[1] + x * s + y * c]; };
  const headC = R([.15, 1.17 - dyH]), shL = R([.078, .985 - dyT]), shR = R([.222, .985 - dyT]);
  let s = '';
  if (st.phone) s += `<circle cx="${st.phone[0]}" cy="${-st.phone[1]}" r=".55" fill="url(#${st.item === 'baby' ? 'glowG' : 'glow'})" opacity="${st.flick}"/>`;
  const [hx, hy] = sv(hip);
  s += `<g transform="rotate(${-ang * 180 / Math.PI} ${hx} ${hy}) translate(0 ${dyT})">${torso(.15, -1.03, .21, .47)}</g>`;
  s += head(sv(headC), .13, { eyes: st.eyes, t: st.t, lit: st.lit, look: st.look, mouth: st.mouth });
  if (st.sit > .02) s += `<g opacity="${clamp(st.sit * 3)}">${arm(sv(shR), sv(st.handR), -1)}${arm(sv(shL), sv(st.handL), 1)}</g>`;
  if (st.phone && st.item === 'baby') {
    const [px, py] = sv(st.phone);
    s += `<rect x="${px - .04}" y="${py - .062}" width=".08" height=".11" rx=".014" fill="#c9cad3"/>
          <rect x="${px - .032}" y="${py - .054}" width=".064" height=".048" rx=".005" fill="#7dffa4"/>
          <path d="M${px + .028} ${py - .06} l.006 -.05" stroke="#c9cad3" stroke-width=".008" stroke-linecap="round"/>
          <circle cx="${st.handL[0]}" cy="${-st.handL[1]}" r=".02" fill="${SKIN}"/><circle cx="${st.handR[0]}" cy="${-st.handR[1]}" r=".02" fill="${SKIN}"/>`;
  } else if (st.phone) {
    const [px, py] = sv(st.phone);
    s += `<rect x="${px - .034}" y="${py - .056}" width=".068" height=".112" rx=".012" fill="#07080f"/>
          <rect x="${px - .034}" y="${py - .056}" width=".068" height=".112" rx=".012" fill="none" stroke="#bcd4ff" stroke-width=".004" opacity=".6"/>
          <circle cx="${st.handL[0]}" cy="${-st.handL[1]}" r=".02" fill="${SKIN}"/><circle cx="${st.handR[0]}" cy="${-st.handR[1]}" r=".02" fill="${SKIN}"/>`;
  }
  if (st.vibAt) {
    const [vx, vy] = sv(st.vibAt);
    s += `<path d="M${vx - .07} ${vy - .03} l-.015 -.015 M${vx + .07} ${vy - .03} l.015 -.015 M${vx - .08} ${vy} l-.02 0 M${vx + .08} ${vy} l.02 0" stroke="#d7e6ff" stroke-width=".008" stroke-linecap="round"/>`;
  }
  return s;
}

/* ------------------------------------------------ Tür-Zustand (gilt für alle Szenen) */
function doorState(t) {
  let handle = 0, open = 0, knock = 0;
  if (TL.handle.length) { const [h0, h1] = TL.handle; const p = ease((t - h0 - .3) / Math.max(.5, h1 - h0 - .3)); handle = .6 * p + (p > 0 && p < 1 ? noise(t * 20) * .03 : 0); }
  if (TL.reveal && TL.reveal.length) { const p = ease((t - TL.reveal[0]) / 1.5); open = (TL.openMax || .4) * p; if (p > 0) handle = Math.max(handle * (1 - p), 0) + .6 * (1 - p); }
  for (const k of TL.knocks) { const a = t - k; if (a >= 0 && a < .16) knock += Math.sin(a * 90) * (1 - a / .16); }
  return { handle, open, knock };
}

/* ------------------------------------------------ Szenen */
async function viewRoom(t, sh) {
  const L = sh.lineTimes, lt = t - sh.start, d = sh.end - sh.start;
  const mode = sh.mode || 'phone', trig = sh.triggerLine ?? 1;
  const T1 = L.length > trig ? L[trig][0] : 1e9, k = t - T1;
  W3.setCam([.15, 1.95, 3.95 - .25 * ease(lt / d)], [-.18, .74, .5], 48);
  const awake = mode === 'phone' ? t > L[0][0] + (L[0][1] - L[0][0]) * .55 : t > T1 + .15;
  const desk = W3.toPlane([-.7, mode === 'baby' ? .64 : .58, .24], PZ);
  const holdL = [HOLD[0] - .035, HOLD[1] - .035], holdR = [HOLD[0] + .035, HOLD[1] - .035];
  if (mode === 'wake') {          // aufwachen, aufsetzen, zum Fenster starren
    const sit = ease((k - .7) / .8), look = awake ? -1.4 * ease((k - .2) / .4) : 0;
    W3.setState({ t, phoneOnDesk: true, phoneLit: false, ...doorState(t), ...windowState(t, false) });
    const body = character({ sit, lean: 0, handL: lerp2([.05, .72], [.06, .74], sit), handR: [.25, .72], phone: null, eyes: awake ? 'wide' : 'closed', look, t, mouth: awake ? 'o' : '' });
    await W3.setChar(svgWrap(.1, 1.0, 2.4, body), .1, 1.0, PZ, 2.4);
    return '';
  }
  const lit = t >= T1;
  const vib = lit && ((k >= 0 && k < .32) || (k >= .44 && k < .76));
  const flick = lit ? .85 + .15 * Math.abs(noise(t * 3)) : 0;
  const sit = ease((k - .35) / .6), lean = ease((k - .75) / .4) - ease((k - 1.45) / .45);
  const reach = ease((k - .85) / .4), back = ease((k - 1.45) / .5), grabbed = k >= 1.3;
  const handL = lerp2(lerp2([.05, .72], [desk[0] + .01, desk[1]], reach), holdL, back);
  const handR = lerp2([.25, .72], holdR, back);
  const phone = grabbed ? lerp2([handL[0] + .015, handL[1] + .03], HOLD, back) : null;
  const look = !awake ? 0 : (lit && back < .5 ? -1.3 * ease(k / .3) : 0);
  W3.setState({ t, phoneOnDesk: !grabbed, phoneLit: lit, phoneVib: vib, flick, phonePos: grabbed ? [phone[0], phone[1], PZ + .12] : [-.7, .66, .26], ...doorState(t) });
  const body = character({ sit, lean, handL, handR, phone, flick, lit: grabbed && back > .4, eyes: awake ? 'open' : 'closed', look, t, vibAt: vib ? desk : null, item: TL.item });
  await W3.setChar(svgWrap(.1, 1.0, 2.4, body), .1, 1.0, PZ, 2.4);
  return '';
}

async function viewFace(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  const look = lt > d * .55 ? Math.sin(Math.min(1, (lt - d * .55) * 3) * Math.PI / 2) * 1.3 * (sh.lookDir || 1) : 0;
  const tr = .002 * noise(t * 9);
  W3.setCam([.15 + tr, 1.1, 1.36 - .08 * ease(lt / d)], [.15, 1.04, .6], 44);
  const flick = .85 + .15 * Math.abs(noise(t * 3));
  W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick, phonePos: [HOLD[0], HOLD[1], PZ + .12], ...doorState(t) });
  const body = character({ sit: 1, lean: 0, handL: [HOLD[0] - .035, HOLD[1] - .035], handR: [HOLD[0] + .035, HOLD[1] - .035], phone: HOLD, flick, lit: true, eyes: 'wide', mouth: 'o', look, t, item: TL.item });
  await W3.setChar(svgWrap(.15, 1.05, .8, body), .15, 1.05, PZ, .8);
  return '';
}

function windowState(t, fig) {
  let tap = 0;
  for (const k of TL.taps || []) { const a = t - k; if (a >= 0 && a < .14) tap = Math.max(tap, Math.sin(a / .14 * Math.PI)); }
  return { winFig: fig ? 1 : 0, tap };
}
async function viewWindow(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  W3.setCam([.25 - .08 * ease(lt / d), 1.22, 1.75 - .2 * ease(lt / d)], [-.95, 1.6, 0], 46);
  W3.setState({ t, phoneOnDesk: false, phoneLit: !!sh.phoneLit, flick: .6, phonePos: [.2, .95, 1.4], ...doorState(t), ...windowState(t, sh.figure) });
  await W3.setChar(null);
  return '';
}
async function viewUnderbed(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  W3.setCam([.15, .15, 3.15 - .35 * ease(lt / d)], [.15, .13, 1.2], 46);
  const eyes = TL.eyes != null ? clamp((t - TL.eyes) / .9) : 0;
  W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick: .5, phonePos: [.15, .9, .9], eyes: eyes * (.92 + .08 * Math.sin(t * 3)), ...doorState(t) });
  await W3.setChar(null);
  return '';
}

function povCam(t, drift = 0) { W3.setCam([.45 + drift * .05, 1.12, 1.75 - drift * .1], [1.37, .98, -.05], 56); }
async function viewDoor(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  if (sh.zoom === 'handle') {
    const r0 = TL.reveal && TL.reveal.length ? TL.reveal[0] : sh.end;
    const pIn = ease(lt / Math.max(1, r0 - sh.start)), pOut = ease((t - r0 + .2) / 1.8);
    const pos = lerp3(lerp3([.72, 1.06, .95], [.86, 1.03, .62], pIn), [.6, 1.58, 1.95], pOut);
    const look = lerp3([1.04, 1.0, 0], [1.1, 1.66, -.3], pOut);
    W3.setCam(pos, look, lerp(38, 36, pOut));
  } else if (sh.zoom === 'visitor') {
    const p = ease(lt / d);
    W3.setCam([.5 + .1 * p, 1.05 - .05 * p, 2.7 - .45 * p], [1.2, .78, -.2], 46);
  } else povCam(t, ease(lt / d));
  W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick: .6, phonePos: [.5, .95, 1.5], ...doorState(t) });
  await W3.setChar(null);
  return '';
}

/* ------------------------------------------------ Video-Babyfon (Nachtsicht) */
function nightVision(t, figure, clock, small = false) {
  const fl = .9 + .1 * Math.abs(noise(t * 7));
  const scan = Array.from({ length: 49 }, (_, i) => `<rect y="${i * 4}" width="260" height="1.4" fill="#000" opacity=".22"/>`).join('');
  const fig = figure ? `<g transform="translate(-28 -50) scale(1.3)">
    <path d="M86 186 L90 70 Q92 46 104 40 Q116 36 122 52 L120 70 L112 186 Z" fill="#020904"/>
    <ellipse cx="128" cy="66" rx="13" ry="17" transform="rotate(38 128 66)" fill="#031006"/>
    <path d="M110 60 Q132 78 142 104" stroke="#031006" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M142 104 l6 4 M141 105 l4 7 M139 105 l1 8" stroke="#2a6a3e" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="131" cy="64" r="1.8" fill="#e6ffee"/><circle cx="125" cy="70" r="1.8" fill="#e6ffee"/></g>` : '';
  return `<svg viewBox="0 0 260 195" width="100%" height="100%" style="display:block">
    <rect width="260" height="195" fill="#0a1a0f"/>
    <polygon points="0,140 260,128 260,195 0,195" fill="#0f2a17"/>
    <rect x="18" y="26" width="46" height="52" fill="#123220"/><rect x="21" y="29" width="40" height="46" fill="#1d4a2c"/>
    <rect x="120" y="96" width="122" height="62" rx="6" fill="#174027"/>
    <rect x="232" y="70" width="12" height="90" rx="3" fill="#1d4c2e"/>
    <ellipse cx="150" cy="108" rx="22" ry="8" fill="#3f8d58"/>
    <circle cx="150" cy="101" r="11" fill="#a8ecbd"/>
    <path d="M145 101 q2 2 4 0 M152 101 q2 2 4 0" stroke="#0a1a0f" stroke-width="1.2" fill="none"/>
    <path d="M126 112 Q180 104 240 112 L240 150 L126 150 Z" fill="#2b6d40"/>
    ${fig}
    <rect width="260" height="195" fill="#7dffa4" opacity="${.05 * fl}"/>${scan}
    ${small ? '' : `<circle cx="14" cy="13" r="3.4" fill="#ff3b30" opacity="${(t % 1.2) < .7 ? 1 : .2}"/>
    <text x="22" y="16.5" font-family="JetBrains Mono" font-size="9" font-weight="700" fill="#d6ffe2">REC</text>
    <text x="246" y="16.5" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="#d6ffe2">0${clock}</text>
    <text x="12" y="186" font-family="JetBrains Mono" font-size="8" fill="#d6ffe2" letter-spacing="1">CAM 1 · KINDERZIMMER</text>`}
  </svg>`;
}
function handBox(x, y, w, h, device) {
  return `<div class="arm" style="left:${x + w / 2 - 30}px;top:${y + h - 20}px;width:60px;height:${960 - y - h + 80}px;transform:rotate(-5deg)"></div>
    <div class="fing" style="left:${x - 15}px;top:${y + h * .3}px;width:27px;height:54px"></div>
    ${[.28, .38, .48].map(f => `<div class="fing" style="left:${x + w - 12}px;top:${y + h * f}px;width:27px;height:42px"></div>`).join('')}
    ${device}`;
}
async function viewMonitor(t, sh) {
  await bgPov(t);
  let lvl = 0;
  for (const [a, b] of TL.hums || []) if (t >= a && t < b) lvl = 3 + 2 * Math.abs(Math.sin(t * 5.3)) * Math.abs(Math.sin(t * 2.1));
  const leds = [0, 1, 2, 3, 4].map(i => `<i style="background:${i < Math.round(lvl) ? (i > 2 ? '#ff6a3d' : '#5dff8f') : '#3b3d46'};box-shadow:${i < Math.round(lvl) ? '0 0 8px ' + (i > 2 ? '#ff6a3d' : '#5dff8f') : 'none'}"></i>`).join('');
  const x = 120, y = 210, w = 300, h = 400;
  return handBox(x, y, w, h, `<div class="ant" style="left:${x + w - 58}px;top:${y - 70}px"></div>
    <div class="baby" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <div class="scr">${nightVision(t, sh.figure, sh.clock)}</div>
      <div class="leds">${leds}</div>
      <div class="grill">${Array.from({ length: 21 }, () => '<b></b>').join('')}</div>
    </div>`);
}

/* ------------------------------------------------ Handy-UI (HTML) */
function phoneBox(x, y, w, h, inner) {
  return `<div class="arm" style="left:${x + w / 2 - 30}px;top:${y + h - 20}px;width:60px;height:${960 - y - h + 80}px;transform:rotate(-5deg)"></div>
    <div class="fing" style="left:${x - 15}px;top:${y + h * .3}px;width:27px;height:54px"></div>
    ${[.28, .38, .48].map(f => `<div class="fing" style="left:${x + w - 12}px;top:${y + h * f}px;width:27px;height:42px"></div>`).join('')}
    <div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <div class="screen"><div class="island"></div>${inner}</div></div>`;
}
async function bgPov(t) {
  if (TL.set && TL.set !== 'bedroom' && typeof SETBG !== 'undefined') return SETBG[TL.set](t); povCam(t, .5); W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick: .8, phonePos: [.5, .95, 1.5], ...doorState(t) }); await W3.setChar(null); }

async function viewLock(t, sh) {
  await bgPov(t);
  const lt = t - sh.start, p = outBack((lt - 0.15) / 0.35), n = sh.notif;
  return phoneBox(118, 150, 304, 620, `<div class="lock"><div class="d">Donnerstag, 5. November</div><div class="c">${sh.clock}</div>
    <div class="notif" style="opacity:${clamp(p)};transform:translateY(${(1 - p) * -18}px) scale(${.9 + .1 * p})"><div class="ic"></div>
    <div style="flex:1"><div class="n">${n.from}<span>jetzt</span></div><div class="m">${n.text}</div></div></div></div>`);
}
async function viewChat(t, sh) {
  await bgPov(t);
  let list = '';
  for (const m of TL.msgs) {
    if (m.t > t || m.chat !== sh.contact) continue;
    const p = outBack((t - m.t) / 0.22);
    list += `<div class="bub ${m.from}" style="transform:scale(${.6 + .4 * p});opacity:${clamp(p * 1.5)}">${m.text}</div>`;
  }
  for (const [a, b, c] of TL.typing) if (t >= a && t < b && c === sh.contact) {
    const dots = [0, 1, 2].map(i => `<i style="opacity:${.35 + .65 * Math.max(0, Math.sin((t * 6 - i * .7)))}"></i>`).join('');
    list += `<div class="bub them typing">${dots}</div>`;
  }
  return phoneBox(118, 150, 304, 620, `<div class="chat">
    <div class="sbar"><span>${sh.clock}</span><span class="bat"><b></b></span></div>
    <div class="hd"><div class="av">${sh.contact[0]}</div><div class="nm">${sh.contact} ›</div></div>
    <div class="day">Heute ${sh.clock}</div><div class="list">${list}</div>
    <div class="inp">iMessage</div></div>`);
}

  <g transform="translate(32 70)"><circle cx="0" cy="0" r="6" fill="#7a5638"/><circle cx="-4.2" cy="-5" r="2.2" fill="#7a5638"/><circle cx="4.2" cy="-5" r="2.2" fill="#7a5638"/>
    <circle cx="0" cy="9" r="7" fill="#6b4a30"/><circle cx="-2" cy="-1" r=".8" fill="#1a120b"/><circle cx="2" cy="-1" r=".8" fill="#1a120b"/><ellipse cx="0" cy="1.8" rx="1.8" ry="1.3" fill="#a88466"/></g>
  ${head([30, 36], 12, { eyes: 'open', mouth: '' })}
  <path d="M19 30 Q22 21 30 23 Q38 21 41 30 Q36 25 30 27 Q24 25 19 30 Z" fill="#6a4a30"/>
</svg>`;

window.setup = async (tl, dpr) => {
  TL = tl;
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas'); c.width = 270; c.height = 480;
    const g = c.getContext('2d'), d = g.createImageData(270, 480);
    for (let p = 0; p < d.data.length; p += 4) { const v = Math.random() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
    g.putImageData(d, 0, 0); GRAIN.push(c.toDataURL());
  }
  await W3.init($('gl'), dpr, { ...SET_ASSETS, creature: CREATURE, fingers: FINGERS, knuckles: KNUCKLES, winFig: WINFIG, winFingers: WINFINGERS, under: UNDER, kid: KID },
    { set: TL.set || 'bedroom', visitor: TL.visitor || 'creature', bedLegs: !!TL.bedLegs, item: TL.item || 'phone', openMax: TL.openMax || .4 });
};

/* ------------------------------------------------ Frame */
window.renderFrame = async (t) => {
  const sh = TL.shots.find(s => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  const lt = t - sh.start, d = sh.end - sh.start;
  const html = await VIEWS[sh.scene](t, sh);
  const gl = $('gl'), st = GLSTYLE[sh.scene];
  gl.style.display = st === 'none' ? 'none' : 'block';
  const dr = TL.ev && TL.ev.dread ? TL.ev.dread[0][0] : null, dk = dr != null && t >= dr && sh.scene !== 'end' ? ease((t - dr) / 1.6) : 0;
  const dreadF = dk ? ` saturate(${1 - .5 * dk}) contrast(${1 + .2 * dk}) brightness(${1 - .22 * dk})` : '';
  gl.style.filter = st === 'none' ? '' : (st + dreadF).trim();
  $('dread').style.opacity = dk;
  $('grain').style.opacity = .085 + .07 * dk;
  gl.style.transform = sh.scene === 'mirror' ? 'scaleX(-1)' : '';
  if (st !== 'none') W3.render();
  $('mid').innerHTML = html;
  const sc = $('scene'), z = ZOOM[sh.scene] || [1, 1];
  let shake = '';
  for (const k of TL.knocks) { const a = t - k; if (a >= 0 && a < .18) shake = `translate(${Math.sin(a * 80) * 3 * (1 - a / .18)}px, ${Math.cos(a * 70) * 2 * (1 - a / .18)}px) `; }
  if (TL.reveal && TL.reveal.length) { const a = t - TL.reveal[0] - 1.0; if (a >= 0 && a < .35) shake = `translate(${Math.sin(a * 60) * 4 * (1 - a / .35)}px, 0) `; }
  if (dk && !shake) shake = `translate(${noise(t * 1.7) * 2.2 * dk}px, ${noise(t * 1.3 + 4) * 1.6 * dk}px) `;
  sc.style.transform = shake + `scale(${z[0] + (z[1] - z[0]) * ease(lt / d)})`;

  let ov = '';
  if (TL.set === 'blackout' && typeof boOverlays !== 'undefined') ov += boOverlays(t, sh);
  const FLAT = TL.set === 'flat';
  if (FLAT && typeof flOverlays !== 'undefined') ov += flOverlays(t, sh);
  if (FLAT) {} else if (t < 3.0 && !TL.noTitle) {
    ov += `<div class="title" style="opacity:${clamp((3.0 - t) / .25)}"><div class="k">${TL.series} · ${TL.episode}</div><div class="t">${TL.title}<br>TEIL ${TL.part}</div></div>`;
  } else if (sh.place && !['lock', 'chat', 'choice', 'end', 'monitor', 'radio'].includes(sh.scene)) {
    const blink = (t % 1.2) < .7 ? 1 : .25;
    ov += `<div class="badge"><div class="tm"><i style="opacity:${blink}"></i>${sh.clock}<small>UHR</small></div><div class="pl">TEIL ${TL.part} · ${sh.place}</div></div>`;
  }
  if (TL.set === 'cellar' && typeof timerOverlay !== 'undefined') ov += timerOverlay(t, sh);
  const q = (TL.quotes || []).find(q => t >= q.start && t < q.end);
  if (q && sh.scene !== 'radio' && !FLAT) ov += `<div class="quote" style="opacity:${clamp((t - q.start) / .2)}"><div class="w">— ${q.who} · ${q.place} —</div><div class="tx">„${q.text}“</div></div>`;
  const g = TL.groups.find(g => t >= g.start && t < g.end);
  if (g) {
    const top = FLAT ? (sh.scene === 'fl_choice' || sh.scene === 'fl_end' ? 790 : 770) : sh.scene === 'choice' ? 720 : 568;
    const ws = g.words.map(i => TL.words[i]).filter(w => w.t <= t + 0.02);
    const last = ws.length - 1;
    ov += `<div class="cap" style="top:${top}px">` + ws.map((w, i) => {
      const p = i === last ? outBack((t - w.t) / .12) : 1;
      return `<span class="${w.c}" style="transform:scale(${.8 + .2 * p})">${w.w}</span>`;
    }).join('') + `</div>`;
  }
  $('overlay').innerHTML = ov;
  $('grain').style.backgroundImage = `url(${GRAIN[Math.floor(t * 24) % GRAIN.length]})`;
};
</script>
