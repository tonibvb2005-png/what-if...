<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #gl { position: absolute; inset: 0; width: 540px; height: 960px; }
  #mid { position: absolute; inset: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #0b0d1c; }
  #stage { position: absolute; inset: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; }
  #scene { position: absolute; inset: 0; will-change: transform; }
  #mid > svg { position: absolute; inset: 0; width: 540px; height: 960px; }
  #fx { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #grain { position: absolute; inset: 0; opacity: .085; background-size: 540px 960px; mix-blend-mode: overlay; }
  #overlay { position: absolute; inset: 0; }

  /* Untertitel */
  .cap { position: absolute; left: 30px; right: 30px; top: 0; text-align: center;
         font: italic 900 37px/1.12 'Montserrat'; text-transform: uppercase; color: #fff;
         -webkit-text-stroke: 8px #000; paint-order: stroke fill; letter-spacing: .3px;
         text-shadow: 0 4px 0 rgba(0,0,0,.55); }
  .cap span { display: inline-block; margin: 0 5px; }
  .y { color: #ffc21f; } .r { color: #ff3b30; } .b { color: #4d9bff; }

  /* Titelkarte + Uhr-Badge */
  .title { position: absolute; top: 118px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.84);
           border-radius: 10px; padding: 10px 22px 12px; text-align: center; white-space: nowrap; }
  .title .k { color: #ff3b30; font: 800 11px 'Montserrat'; letter-spacing: .6px; }
  .title .t { color: #fff; font: 900 25px/1.1 'Montserrat'; margin-top: 4px; }
  .badge { position: absolute; top: 112px; left: 30px; background: rgba(8,10,24,.78); border-radius: 8px;
           padding: 8px 14px 9px 12px; }
  .badge .tm { font: 700 27px/1 'JetBrains Mono'; color: #ffc21f; display: flex; align-items: center; gap: 6px; }
  .badge .tm i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; display: inline-block; margin-top: -12px; }
  .badge .tm small { font: 700 11px 'JetBrains Mono'; margin-top: 8px; }
  .badge .pl { font: 500 10px 'JetBrains Mono'; color: #9aa0b8; letter-spacing: 1.6px; margin-top: 5px; }

  /* Handy */
  .phone { position: absolute; background: #08080c; border: 3px solid #3a3a46; border-radius: 46px; padding: 9px;
           box-shadow: 0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(110,140,255,.12); }
  .phone .btn { position: absolute; width: 5px; border-radius: 3px; background: #1d1d26; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #000; color: #fff; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 14px; background: #000; z-index: 3; }
  .sbar { position: absolute; top: 14px; left: 28px; right: 24px; display: flex; justify-content: space-between; font: 700 12px 'Montserrat'; z-index: 2; }
  .bat { width: 22px; height: 11px; border: 1.5px solid #888; border-radius: 3px; padding: 1px; }
  .bat b { display: block; height: 100%; width: 22%; background: #ff3b30; border-radius: 1px; }
  .arm { position: absolute; background: #d5cdbf; clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); transform-origin: 50% 0; }
  .fing { position: absolute; background: #e6dfd2; border-radius: 14px; box-shadow: inset -2px -2px 0 rgba(0,0,0,.06); z-index: 2; }

  .lock { position: absolute; inset: 0; background: linear-gradient(170deg, #2a1d5e 0%, #4f3391 45%, #6b3f9e 75%, #3a2770 100%); text-align: center; }
  .lock .d { margin-top: 62px; font: 700 13px 'Montserrat'; opacity: .85; }
  .lock .c { font: 900 86px/1 'Montserrat'; letter-spacing: -2px; margin-top: 4px; }
  .notif { position: absolute; left: 12px; right: 12px; top: 190px; border-radius: 18px; background: rgba(255,255,255,.17);
           padding: 11px 12px; display: flex; gap: 10px; text-align: left; backdrop-filter: blur(6px); }
  .notif .ic { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(#5dea74, #23c043); flex: none; position: relative; }
  .notif .ic:after { content: ''; position: absolute; left: 8px; top: 9px; width: 18px; height: 14px; background: #fff; border-radius: 50%; }
  .notif .n { font: 800 13px 'Montserrat'; display: flex; justify-content: space-between; }
  .notif .n span { font-weight: 700; opacity: .6; font-size: 11px; }
  .notif .m { font: 700 12.5px 'Montserrat'; opacity: .92; margin-top: 2px; }

  .chat .hd { position: absolute; top: 44px; left: 0; right: 0; text-align: center; padding-bottom: 8px; border-bottom: 1px solid #1c1c22; }
  .chat .av { width: 42px; height: 42px; border-radius: 50%; margin: 0 auto; background: linear-gradient(#9b9ba6, #6b6b76);
              font: 800 18px/42px 'Montserrat'; color: #fff; }
  .chat .nm { font: 700 11px 'Montserrat'; margin-top: 4px; }
  .chat .day { text-align: center; font: 700 9.5px 'Montserrat'; color: #8a8a92; margin: 128px 0 8px; }
  .chat .list { padding: 0 12px; display: flex; flex-direction: column; gap: 7px; }
  .bub { max-width: 74%; padding: 8px 12px; border-radius: 17px; font: 700 13.5px/1.28 'Montserrat'; transform-origin: left bottom; }
  .bub.them { background: #2a2a2f; align-self: flex-start; border-bottom-left-radius: 5px; }
  .bub.me { background: #1f8bff; align-self: flex-end; border-bottom-right-radius: 5px; transform-origin: right bottom; }
  .bub.typing { display: flex; gap: 5px; padding: 12px 14px; }
  .bub.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9a9aa2; display: block; }
  .chat .inp { position: absolute; bottom: 18px; left: 12px; right: 12px; height: 32px; border-radius: 16px; border: 1px solid #2c2c33;
               font: 600 11px/30px 'Montserrat'; color: #66666e; padding-left: 14px; }

  .choice h1 { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font: 900 34px 'Montserrat'; color: #fff; letter-spacing: .5px; }
  .pill { position: absolute; font: 900 13px 'Montserrat'; color: #fff; padding: 6px 14px; border-radius: 20px; letter-spacing: .6px; }

  .end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1a1e3d, #0b0d1c 70%); text-align: center; color: #fff; }
  .end .s { font: 500 11px 'JetBrains Mono'; letter-spacing: 4px; color: #9aa0b8; margin-top: 18px; }
  .end .p { font: 900 112px/1 'Montserrat'; color: #ff3b30; margin-top: 8px; letter-spacing: -1px; }
  .end .h { font: 800 17px 'Montserrat'; letter-spacing: 3px; margin-top: 6px; }
  .end .f { display: inline-block; margin-top: 22px; border: 2px solid #fff; border-radius: 22px; padding: 8px 20px; font: 800 13px 'Montserrat'; letter-spacing: 1.5px; }
  .end .q { font: italic 800 17px 'Montserrat'; color: #ffc21f; margin-top: 22px; }
</style></head>
<body><div id="stage"><div id="scene"><canvas id="gl"></canvas><div id="mid"></div></div><div id="fx"></div><div id="grain"></div><div id="overlay"></div></div>
<script src="node_modules/three/build/three.min.js"></script>
<script src="world3d.js"></script>
<script>
let TL, GRAIN = [];
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const outBack = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const noise = (t, s = 1) => Math.sin(t * 12.9898 * s + 78.233) * Math.sin(t * 3.17 * s + 1.3);
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const lerp3 = (p, q, k) => [0, 1, 2].map(i => lerp(p[i], q[i], k));

/* ------------------------------------------------ 2D-Figur (SVG, Einheiten = Meter, y nach unten = -Welt-y) */
const SKIN = '#e3e9ff', SHIRT = '#7c3347', SHIRT_HI = '#94405a', INK = '#11142a';
const DEFS = `<defs>
  <radialGradient id="headG" cx="42%" cy="34%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3e9ff"/><stop offset="1" stop-color="#aab7e8"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a9c8ff" stop-opacity=".5"/><stop offset="1" stop-color="#a9c8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#ffb35a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></radialGradient>
  <linearGradient id="lit" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bcd4ff" stop-opacity=".5"/><stop offset=".6" stop-color="#bcd4ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="cface" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#e9ecf7"/><stop offset=".7" stop-color="#c3c8de"/><stop offset="1" stop-color="#8a8fa8"/></radialGradient>
</defs>`;
const sv = (p) => [p[0], -p[1]];
const svgWrap = (cx, cy, S, body, px = 2048) => `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="${cx - S / 2} ${-(cy + S / 2)} ${S} ${S}">${DEFS}${body}</svg>`;

function head(c, r, o = {}) {
  const [cx, cy] = c;
  let eyes = o.eyes || 'open';
  if (eyes !== 'closed' && o.t !== undefined && (o.t % 3.7) < 0.11) eyes = 'closed';
  const lx = (o.look || 0) * r * 0.09, ex = r * 0.3, ey = cy - r * 0.04, er = r * (eyes === 'wide' ? 0.085 : 0.07);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#headG)"/>`;
  if (o.lit) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#lit)"/>`;
  if (eyes === 'closed') {
    for (const k of [-1, 1]) s += `<path d="M${cx + k * ex - er * 1.7} ${ey} Q${cx + k * ex} ${ey + er * 1.8} ${cx + k * ex + er * 1.7} ${ey}" stroke="${INK}" stroke-width="${r * .035}" fill="none" stroke-linecap="round"/>`;
  } else for (const k of [-1, 1]) {
    s += `<circle cx="${cx + k * ex + lx}" cy="${ey}" r="${er}" fill="${INK}"/>`;
    if (eyes === 'wide') s += `<circle cx="${cx + k * ex + lx + er * .35}" cy="${ey - er * .35}" r="${er * .32}" fill="#9fd8ff"/>`;
  }
  const my = cy + r * 0.32;
  if (o.mouth === 'o') s += `<ellipse cx="${cx + lx * .5}" cy="${my}" rx="${r * .055}" ry="${r * .04}" fill="${INK}"/>`;
  else s += `<path d="M${cx - r * .07} ${my} Q${cx} ${my - r * .025} ${cx + r * .07} ${my}" stroke="${INK}" stroke-width="${r * .028}" fill="none" stroke-linecap="round"/>`;
  return s;
}
function torso(cx, top, w, h) {
  const a = w * .09, b = w * .28, c = w * .065;
  return `<path d="M${cx - w / 2 + a} ${top} Q${cx} ${top - a} ${cx + w / 2 - a} ${top} Q${cx + w / 2 + a * .5} ${top + a * .7} ${cx + w / 2} ${top + b} L${cx + w / 2 - c} ${top + h} L${cx - w / 2 + c} ${top + h} L${cx - w / 2} ${top + b} Q${cx - w / 2 - a * .5} ${top + a * .7} ${cx - w / 2 + a} ${top} Z" fill="${SHIRT}"/>
    <path d="M${cx - w * .17} ${top - w * .02} Q${cx} ${top + w * .13} ${cx + w * .17} ${top - w * .02}" stroke="${SHIRT_HI}" stroke-width="${w * .055}" fill="none" stroke-linecap="round"/>`;
}
function arm(s, h, bend = 1) {
  const mx = (s[0] + h[0]) / 2, my = (s[1] + h[1]) / 2, dx = h[0] - s[0], dy = h[1] - s[1], L = Math.hypot(dx, dy) || 1;
  const off = Math.min(.07, L * .28) * bend, c = [mx - dy / L * off, my + dx / L * off];
  return `<path d="M${s[0]} ${s[1]} Q${c[0]} ${c[1]} ${h[0]} ${h[1]}" stroke="${SKIN}" stroke-width=".026" fill="none" stroke-linecap="round"/><circle cx="${h[0]}" cy="${h[1]}" r=".02" fill="${SKIN}"/>`;
}

// Figur im Bett. Welt-Koordinaten (Meter). PZ = Tiefe der Figuren-Ebene.
const PZ = .62, HOLD = [.15, .93];
function character(st) {
  const hip = [.15, .6], dyH = (1 - st.sit) * .37, dyT = (1 - st.sit) * .47, ang = .45 * (st.lean || 0);
  const R = (p) => { const x = p[0] - hip[0], y = p[1] - hip[1], c = Math.cos(ang), s = Math.sin(ang); return [hip[0] + x * c - y * s, hip[1] + x * s + y * c]; };
  const headC = R([.15, 1.17 - dyH]), shL = R([.078, .985 - dyT]), shR = R([.222, .985 - dyT]);
  let s = '';
  if (st.phone) s += `<circle cx="${st.phone[0]}" cy="${-st.phone[1]}" r=".55" fill="url(#glow)" opacity="${st.flick}"/>`;
  const [hx, hy] = sv(hip);
  s += `<g transform="rotate(${-ang * 180 / Math.PI} ${hx} ${hy}) translate(0 ${dyT})">${torso(.15, -1.03, .21, .47)}</g>`;
  s += head(sv(headC), .13, { eyes: st.eyes, t: st.t, lit: st.lit, look: st.look, mouth: st.mouth });
  if (st.sit > .02) s += `<g opacity="${clamp(st.sit * 3)}">${arm(sv(shR), sv(st.handR), -1)}${arm(sv(shL), sv(st.handL), 1)}</g>`;
  if (st.phone) {
    const [px, py] = sv(st.phone);
    s += `<rect x="${px - .034}" y="${py - .056}" width=".068" height=".112" rx=".012" fill="#07080f"/>
          <rect x="${px - .034}" y="${py - .056}" width=".068" height=".112" rx=".012" fill="none" stroke="#bcd4ff" stroke-width=".004" opacity=".6"/>
          <circle cx="${st.handL[0]}" cy="${-st.handL[1]}" r=".02" fill="${SKIN}"/><circle cx="${st.handR[0]}" cy="${-st.handR[1]}" r=".02" fill="${SKIN}"/>`;
  }
  if (st.vibAt) {
    const [vx, vy] = sv(st.vibAt);
    s += `<path d="M${vx - .07} ${vy - .03} l-.015 -.015 M${vx + .07} ${vy - .03} l.015 -.015 M${vx - .08} ${vy} l-.02 0 M${vx + .08} ${vy} l.02 0" stroke="#d7e6ff" stroke-width=".008" stroke-linecap="round"/>`;
  }
  return s;
}

/* ------------------------------------------------ Tür-Zustand (gilt für alle Szenen) */
function doorState(t) {
  let handle = 0, open = 0, knock = 0;
  if (TL.handle.length) { const [h0, h1] = TL.handle; const p = ease((t - h0 - .3) / Math.max(.5, h1 - h0 - .3)); handle = .6 * p + (p > 0 && p < 1 ? noise(t * 20) * .03 : 0); }
  if (TL.reveal && TL.reveal.length) { const p = ease((t - TL.reveal[0]) / 1.5); open = .78 * p; if (p > 0) handle = Math.max(handle * (1 - p), 0) + .6 * (1 - p); }
  for (const k of TL.knocks) { const a = t - k; if (a >= 0 && a < .16) knock += Math.sin(a * 90) * (1 - a / .16); }
  return { handle, open, knock };
}

/* ------------------------------------------------ Szenen */
async function viewRoom(t, sh) {
  const L = sh.lineTimes, T1 = L.length > 1 ? L[1][0] : 1e9, lt = t - sh.start, d = sh.end - sh.start;
  W3.setCam([.15, 1.95, 3.95 - .25 * ease(lt / d)], [-.18, .74, .5], 48);
  const awake = t > L[0][0] + (L[0][1] - L[0][0]) * .55, lit = t >= T1, k = t - T1;
  const vib = lit && ((k >= 0 && k < .32) || (k >= .44 && k < .76));
  const flick = lit ? .85 + .15 * Math.abs(noise(t * 3)) : 0;
  const sit = ease((k - .35) / .6), lean = ease((k - .75) / .4) - ease((k - 1.45) / .45);
  const reach = ease((k - .85) / .4), back = ease((k - 1.45) / .5), grabbed = k >= 1.3;
  const desk = W3.toPlane([-.7, .58, .24], PZ);
  const holdL = [HOLD[0] - .035, HOLD[1] - .035], holdR = [HOLD[0] + .035, HOLD[1] - .035];
  const handL = lerp2(lerp2([.05, .72], [desk[0] + .01, desk[1]], reach), holdL, back);
  const handR = lerp2([.25, .72], holdR, back);
  const phone = grabbed ? lerp2([handL[0] + .015, handL[1] + .03], HOLD, back) : null;
  const look = !awake ? 0 : (lit && back < .5 ? -1.3 * ease(k / .3) : 0);
  W3.setState({ t, phoneOnDesk: !grabbed, phoneLit: lit, phoneVib: vib, flick, phonePos: grabbed ? [phone[0], phone[1], PZ + .12] : [-.7, .64, .26], ...doorState(t) });
  const body = character({ sit, lean, handL, handR, phone, flick, lit: grabbed && back > .4, eyes: awake ? 'open' : 'closed', look, t, vibAt: vib ? desk : null });
  await W3.setChar(svgWrap(.1, 1.0, 2.4, body), .1, 1.0, PZ, 2.4);
  return '';
}

async function viewFace(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  const look = lt > d * .55 ? Math.sin(Math.min(1, (lt - d * .55) * 3) * Math.PI / 2) * 1.3 : 0;
  const tr = .002 * noise(t * 9);
  W3.setCam([.15 + tr, 1.1, 1.36 - .08 * ease(lt / d)], [.15, 1.04, .6], 44);
  const flick = .85 + .15 * Math.abs(noise(t * 3));
  W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick, phonePos: [HOLD[0], HOLD[1], PZ + .12], ...doorState(t) });
  const body = character({ sit: 1, lean: 0, handL: [HOLD[0] - .035, HOLD[1] - .035], handR: [HOLD[0] + .035, HOLD[1] - .035], phone: HOLD, flick, lit: true, eyes: 'wide', mouth: 'o', look, t });
  await W3.setChar(svgWrap(.15, 1.05, .8, body), .15, 1.05, PZ, .8);
  return '';
}

function povCam(t, drift = 0) { W3.setCam([.45 + drift * .05, 1.12, 1.75 - drift * .1], [1.37, .98, -.05], 56); }
async function viewDoor(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  if (sh.zoom === 'handle') {
    const r0 = TL.reveal && TL.reveal.length ? TL.reveal[0] : sh.end;
    const pIn = ease(lt / Math.max(1, r0 - sh.start)), pOut = ease((t - r0 + .2) / 1.8);
    const pos = lerp3(lerp3([.72, 1.06, .95], [.86, 1.03, .62], pIn), [.72, 1.3, 3.0], pOut);
    const look = lerp3([1.04, 1.0, 0], [1.12, 1.2, -.3], pOut);
    W3.setCam(pos, look, lerp(38, 50, pOut));
  } else povCam(t, ease(lt / d));
  W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick: .6, phonePos: [.5, .95, 1.5], ...doorState(t) });
  await W3.setChar(null);
  return '';
}

/* ------------------------------------------------ Handy-UI (HTML) */
function phoneBox(x, y, w, h, inner) {
  return `<div class="arm" style="left:${x + w / 2 - 30}px;top:${y + h - 20}px;width:60px;height:${960 - y - h + 80}px;transform:rotate(-5deg)"></div>
    <div class="fing" style="left:${x - 15}px;top:${y + h * .3}px;width:27px;height:54px"></div>
    ${[.28, .38, .48].map(f => `<div class="fing" style="left:${x + w - 12}px;top:${y + h * f}px;width:27px;height:42px"></div>`).join('')}
    <div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <div class="screen"><div class="island"></div>${inner}</div></div>`;
}
async function bgPov(t) { povCam(t, .5); W3.setState({ t, phoneOnDesk: false, phoneLit: true, flick: .8, phonePos: [.5, .95, 1.5], ...doorState(t) }); await W3.setChar(null); }

async function viewLock(t, sh) {
  await bgPov(t);
  const lt = t - sh.start, p = outBack((lt - 0.15) / 0.35), n = sh.notif;
  return phoneBox(118, 150, 304, 620, `<div class="lock"><div class="d">Donnerstag, 5. November</div><div class="c">${sh.clock}</div>
    <div class="notif" style="opacity:${clamp(p)};transform:translateY(${(1 - p) * -18}px) scale(${.9 + .1 * p})"><div class="ic"></div>
    <div style="flex:1"><div class="n">${n.from}<span>jetzt</span></div><div class="m">${n.text}</div></div></div></div>`);
}
async function viewChat(t, sh) {
  await bgPov(t);
  let list = '';
  for (const m of TL.msgs) {
    if (m.t > t || m.chat !== sh.contact) continue;
    const p = outBack((t - m.t) / 0.22);
    list += `<div class="bub ${m.from}" style="transform:scale(${.6 + .4 * p});opacity:${clamp(p * 1.5)}">${m.text}</div>`;
  }
  for (const [a, b, c] of TL.typing) if (t >= a && t < b && c === sh.contact) {
    const dots = [0, 1, 2].map(i => `<i style="opacity:${.35 + .65 * Math.max(0, Math.sin((t * 6 - i * .7)))}"></i>`).join('');
    list += `<div class="bub them typing">${dots}</div>`;
  }
  return phoneBox(118, 150, 304, 620, `<div class="chat">
    <div class="sbar"><span>${sh.clock}</span><span class="bat"><b></b></span></div>
    <div class="hd"><div class="av">${sh.contact[0]}</div><div class="nm">${sh.contact} ›</div></div>
    <div class="day">Heute ${sh.clock}</div><div class="list">${list}</div>
    <div class="inp">iMessage</div></div>`);
}
function miniChat(o, x, p) {
  const { text, label, color, contact } = o;
  return `<div style="opacity:${clamp(p)};transform:translateY(${(1 - p) * 20}px)">
    <div class="pill" style="left:${x + 100}px;top:228px;transform:translateX(-50%);background:${color}">${label}</div>
    <div class="phone" style="left:${x}px;top:272px;width:200px;height:400px;border-radius:34px;padding:7px">
    <div class="screen" style="border-radius:28px"><div class="island" style="width:62px;height:18px;top:8px"></div>
    <div class="chat"><div class="hd" style="top:30px"><div class="av" style="width:30px;height:30px;font-size:13px;line-height:30px">${contact[0]}</div><div class="nm" style="font-size:9px">${contact} ›</div></div>
    <div class="list" style="padding-top:112px;padding-left:9px;padding-right:9px"><div class="bub them" style="font-size:11.5px;max-width:90%">${text}</div></div></div></div></div></div>`;
}
async function viewChoice(t, sh) {
  await bgPov(t);
  const lt = t - sh.start;
  return `<div class="choice"><h1 style="opacity:${clamp(lt / .25)}">WEM GLAUBST DU?</h1>
    ${miniChat(sh.left, 40, outBack((lt - .15) / .35))}
    ${miniChat(sh.right, 300, outBack((lt - .45) / .35))}</div>`;
}
async function viewEnd(t, sh) {
  const lt = t - sh.start, a = (d) => `opacity:${clamp((lt - d) / .3)};transform:translateY(${(1 - ease((lt - d) / .3)) * 14}px)`;
  const door = `<svg viewBox="0 0 200 150" width="200" height="150" style="display:block;margin:0 auto">
    <rect x="50" y="10" width="100" height="128" fill="#05060f"/>
    <rect x="58" y="22" width="22" height="116" fill="#3a2412"/>
    <ellipse cx="68" cy="48" rx="9" ry="13" fill="#cfd3e6"/><circle cx="65" cy="45" r="2.4" fill="#000"/><circle cx="72" cy="45" r="2.4" fill="#000"/>
    <path d="M62 54 Q68 59 75 53" stroke="#000" stroke-width="1.6" fill="none"/><path d="M68 61 L68 70 M63 70 Q68 68 74 70 L72 100 L70 136 M66 100 L64 136 M63 71 L60 112 M73 71 L78 80" stroke="#9a9eb0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polygon points="80,10 150,10 150,138 80,138" fill="#181d45" stroke="#0b0f2c" stroke-width="4"/>
    <circle cx="92" cy="78" r="4" fill="#7a83b6"/><rect x="52" y="134" width="96" height="4" fill="#ffbe6a"/>
    ${[0, 1, 2, 3].map(i => `<path d="M80 ${44 + i * 5} q6 -1 11 1" stroke="#cfd3e6" stroke-width="2.2" stroke-linecap="round" fill="none"/>`).join('')}</svg>`;
  return `<div class="end"><div style="margin-top:205px;${a(0)}">${door}</div>
    <div class="s" style="${a(.1)}">${TL.title}</div><div class="p" style="${a(.2)}">TEIL ${TL.part + 1}</div>
    <div class="h" style="${a(.35)}">HEUTE NACHT</div><div style="${a(.5)}"><span class="f">FOLGE FÜR TEIL ${TL.part + 1}</span></div>
    <div class="q" style="${a(.7)}">${TL.question}</div></div>`;
}

const VIEWS = { room: viewRoom, face: viewFace, door: viewDoor, lock: viewLock, chat: viewChat, choice: viewChoice, end: viewEnd };
const GLSTYLE = { room: '', face: '', door: '', lock: 'blur(9px) brightness(.7)', chat: 'blur(9px) brightness(.7)', choice: 'blur(10px) brightness(.55)', end: 'none' };
const ZOOM = { lock: [1.0, 1.03], chat: [1.0, 1.03], choice: [1.0, 1.02] };

/* ------------------------------------------------ Kreatur + Finger (2D-Texturen für den Flur) */

  <defs>
    <linearGradient id="skinC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e7286"/><stop offset=".45" stop-color="#b3b7c8"/><stop offset="1" stop-color="#7a7e92"/></linearGradient>
    <radialGradient id="shadowC" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="225" cy="1142" rx="110" ry="12" fill="url(#shadowC)"/>
  <g stroke="rgba(255,176,96,.45)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Beine: lang, dürr, knotige Knie -->
    <path d="M206 700 Q196 820 190 920 Q186 1030 178 1135 L196 1137 Q204 1030 208 925 Q214 820 222 705 Z" fill="url(#skinC)"/>

    <path d="M178 1133 l-22 6 l40 2 Z M274 1133 l26 6 l-44 2 Z" fill="#8a8ea2"/>
    <!-- Linker Arm hängt bis unter die Knie -->
    <path d="M172 396 Q150 520 146 640 Q142 760 136 860 L150 862 Q158 760 162 642 Q168 522 186 402 Z" fill="url(#skinC)"/>
    <path d="M138 858 q-8 40 -6 70 M143 860 q-2 44 2 78 M149 860 q4 40 12 66 M134 856 q-16 28 -20 52" stroke="#a3a7b9" stroke-width="5" fill="none"/>
    <!-- Rechter Arm greift zur Türkante -->
    <path d="M270 400 Q330 430 372 470 Q410 440 450 404 L450 424 Q412 462 372 492 Q326 456 262 420 Z" fill="url(#skinC)"/>
    <!-- Rumpf: schmal, eingefallen -->
    <path d="M168 392 Q225 368 282 392 Q284 470 262 560 Q256 640 248 708 L200 708 Q192 640 186 560 Q166 470 168 392 Z" fill="url(#skinC)"/>
  </g>
  <g stroke="#5f6377" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".85">
    ${[0, 1, 2, 3, 4].map(i => `<path d="M${190 + i * 2} ${438 + i * 24} Q225 ${450 + i * 24} ${260 - i * 2} ${438 + i * 24}"/>`).join('')}
    <path d="M225 420 L225 560"/><path d="M200 400 Q225 410 250 400"/>
  </g>
  <!-- Hals, leicht verdreht -->
  <path d="M212 290 Q206 340 214 396 L236 396 Q240 340 236 290 Z" fill="url(#skinC)" stroke="rgba(255,176,96,.45)" stroke-width="3"/>
  <path d="M216 320 Q225 326 234 320 M216 350 Q225 356 234 350" stroke="#5f6377" stroke-width="2.5" fill="none"/>
  <!-- Kopf (schief) -->
  <g transform="rotate(-12 225 200)">
    <ellipse cx="225" cy="190" rx="66" ry="98" fill="url(#cface)"/>
    <ellipse cx="198" cy="170" rx="21" ry="29" fill="#05050a"/><ellipse cx="254" cy="170" rx="21" ry="29" fill="#05050a"/>
    <circle cx="201" cy="166" r="4.5" fill="#fff"/><circle cx="257" cy="166" r="4.5" fill="#fff"/>
    <path d="M168 224 Q225 284 284 224 Q225 258 168 224 Z" fill="#05050a"/>
    ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<rect x="${179 + i * 11}" y="${234 - Math.abs(i - 4) * 1.5}" width="7" height="11" rx="2" fill="#e9e6da"/>`).join('')}
  </g>
</svg>`;
const FINGERS = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">
  ${[0, 1, 2, 3].map(i => { const y = 50 + i * 30, L = [118, 140, 132, 104][i];
    return `<path d="M0 ${y} Q${L * .5} ${y - 9} ${L} ${y + 6}" stroke="#c9cddd" stroke-width="15" fill="none" stroke-linecap="round"/>
      <path d="M${L * .38} ${y - 6} l0 9 M${L * .7} ${y - 4} l0 9" stroke="#8d92a8" stroke-width="2"/>
      <ellipse cx="${L - 3}" cy="${y + 5}" rx="5" ry="4" fill="#5c5a50"/>`; }).join('')}
</svg>`;

window.setup = async (tl, dpr) => {
  TL = tl;
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas'); c.width = 270; c.height = 480;
    const g = c.getContext('2d'), d = g.createImageData(270, 480);
    for (let p = 0; p < d.data.length; p += 4) { const v = Math.random() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
    g.putImageData(d, 0, 0); GRAIN.push(c.toDataURL());
  }
  await W3.init($('gl'), dpr, CREATURE, FINGERS);
};

/* ------------------------------------------------ Frame */
window.renderFrame = async (t) => {
  const sh = TL.shots.find(s => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  const lt = t - sh.start, d = sh.end - sh.start;
  const html = await VIEWS[sh.scene](t, sh);
  const gl = $('gl'), st = GLSTYLE[sh.scene];
  gl.style.display = st === 'none' ? 'none' : 'block';
  gl.style.filter = st === 'none' ? '' : st;
  if (st !== 'none') W3.render();
  $('mid').innerHTML = html;
  const sc = $('scene'), z = ZOOM[sh.scene] || [1, 1];
  let shake = '';
  for (const k of TL.knocks) { const a = t - k; if (a >= 0 && a < .18) shake = `translate(${Math.sin(a * 80) * 3 * (1 - a / .18)}px, ${Math.cos(a * 70) * 2 * (1 - a / .18)}px) `; }
  if (TL.reveal && TL.reveal.length) { const a = t - TL.reveal[0] - 1.0; if (a >= 0 && a < .35) shake = `translate(${Math.sin(a * 60) * 4 * (1 - a / .35)}px, 0) `; }
  sc.style.transform = shake + `scale(${z[0] + (z[1] - z[0]) * ease(lt / d)})`;

  let ov = '';
  if (t < 3.0) {
    ov += `<div class="title" style="opacity:${clamp((3.0 - t) / .25)}"><div class="k">${TL.series} · ${TL.episode}</div><div class="t">${TL.title}<br>TEIL ${TL.part}</div></div>`;
  } else if (sh.place && ['room', 'face', 'door'].includes(sh.scene)) {
    const blink = (t % 1.2) < .7 ? 1 : .25;
    ov += `<div class="badge"><div class="tm"><i style="opacity:${blink}"></i>${sh.clock}<small>UHR</small></div><div class="pl">TEIL ${TL.part} · ${sh.place}</div></div>`;
  }
  const g = TL.groups.find(g => t >= g.start && t < g.end);
  if (g) {
    const top = sh.scene === 'choice' ? 720 : 568;
    const ws = g.words.map(i => TL.words[i]).filter(w => w.t <= t + 0.02);
    const last = ws.length - 1;
    ov += `<div class="cap" style="top:${top}px">` + ws.map((w, i) => {
      const p = i === last ? outBack((t - w.t) / .12) : 1;
      return `<span class="${w.c}" style="transform:scale(${.8 + .2 * p})">${w.w}</span>`;
    }).join('') + `</div>`;
  }
  $('overlay').innerHTML = ov;
  $('grain').style.backgroundImage = `url(${GRAIN[Math.floor(t * 24) % GRAIN.length]})`;
};
</script></body></html>
