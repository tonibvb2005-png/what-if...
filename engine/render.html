<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #0b0d1c; }
  #stage { position: absolute; inset: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; }
  #scene { position: absolute; inset: 0; will-change: transform; }
  #scene > svg { position: absolute; inset: 0; width: 540px; height: 960px; }
  #fx { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #grain { position: absolute; inset: 0; opacity: .085; background-size: 540px 960px; mix-blend-mode: overlay; }
  #overlay { position: absolute; inset: 0; }

  /* Untertitel */
  .cap { position: absolute; left: 30px; right: 30px; top: 0; text-align: center;
         font: italic 900 37px/1.12 'Montserrat'; text-transform: uppercase; color: #fff;
         -webkit-text-stroke: 8px #000; paint-order: stroke fill; letter-spacing: .3px;
         text-shadow: 0 4px 0 rgba(0,0,0,.55); }
  .cap span { display: inline-block; margin: 0 5px; }
  .y { color: #ffc21f; } .r { color: #ff3b30; } .b { color: #4d9bff; }

  /* Titelkarte + Uhr-Badge */
  .title { position: absolute; top: 118px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.84);
           border-radius: 10px; padding: 10px 22px 12px; text-align: center; white-space: nowrap; }
  .title .k { color: #ff3b30; font: 800 11px 'Montserrat'; letter-spacing: .6px; }
  .title .t { color: #fff; font: 900 25px/1.1 'Montserrat'; margin-top: 4px; }
  .badge { position: absolute; top: 112px; left: 30px; background: rgba(8,10,24,.78); border-radius: 8px;
           padding: 8px 14px 9px 12px; }
  .badge .tm { font: 700 27px/1 'JetBrains Mono'; color: #ffc21f; display: flex; align-items: center; gap: 6px; }
  .badge .tm i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; display: inline-block; margin-top: -12px; }
  .badge .tm small { font: 700 11px 'JetBrains Mono'; margin-top: 8px; }
  .badge .pl { font: 500 10px 'JetBrains Mono'; color: #9aa0b8; letter-spacing: 1.6px; margin-top: 5px; }

  /* Handy */
  .phone { position: absolute; background: #08080c; border: 2px solid #2b2b36; border-radius: 46px; padding: 9px;
           box-shadow: 0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(110,140,255,.12); }
  .phone .btn { position: absolute; width: 5px; border-radius: 3px; background: #1d1d26; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #000; color: #fff; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 14px; background: #000; z-index: 3; }
  .sbar { position: absolute; top: 14px; left: 28px; right: 24px; display: flex; justify-content: space-between; font: 700 12px 'Montserrat'; z-index: 2; }
  .bat { width: 22px; height: 11px; border: 1.5px solid #888; border-radius: 3px; padding: 1px; }
  .bat b { display: block; height: 100%; width: 22%; background: #ff3b30; border-radius: 1px; }
  .arm { position: absolute; background: linear-gradient(90deg, #cfc3ad, #e2d8c6 45%, #cbbfa8); border-radius: 26px 26px 0 0; }

  .lock { position: absolute; inset: 0; background: linear-gradient(170deg, #2a1d5e 0%, #4f3391 45%, #6b3f9e 75%, #3a2770 100%); text-align: center; }
  .lock .d { margin-top: 62px; font: 700 13px 'Montserrat'; opacity: .85; }
  .lock .c { font: 900 86px/1 'Montserrat'; letter-spacing: -2px; margin-top: 4px; }
  .notif { position: absolute; left: 12px; right: 12px; top: 190px; border-radius: 18px; background: rgba(255,255,255,.17);
           padding: 11px 12px; display: flex; gap: 10px; text-align: left; backdrop-filter: blur(6px); }
  .notif .ic { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(#5dea74, #23c043); flex: none; position: relative; }
  .notif .ic:after { content: ''; position: absolute; left: 8px; top: 9px; width: 18px; height: 14px; background: #fff; border-radius: 50%; }
  .notif .n { font: 800 13px 'Montserrat'; display: flex; justify-content: space-between; }
  .notif .n span { font-weight: 700; opacity: .6; font-size: 11px; }
  .notif .m { font: 700 12.5px 'Montserrat'; opacity: .92; margin-top: 2px; }

  .chat .hd { position: absolute; top: 44px; left: 0; right: 0; text-align: center; padding-bottom: 8px; border-bottom: 1px solid #1c1c22; }
  .chat .av { width: 42px; height: 42px; border-radius: 50%; margin: 0 auto; background: linear-gradient(#9b9ba6, #6b6b76);
              font: 800 18px/42px 'Montserrat'; color: #fff; }
  .chat .nm { font: 700 11px 'Montserrat'; margin-top: 4px; }
  .chat .day { text-align: center; font: 700 9.5px 'Montserrat'; color: #8a8a92; margin: 128px 0 8px; }
  .chat .list { padding: 0 12px; display: flex; flex-direction: column; gap: 7px; }
  .bub { max-width: 74%; padding: 8px 12px; border-radius: 17px; font: 700 13.5px/1.28 'Montserrat'; transform-origin: left bottom; }
  .bub.them { background: #2a2a2f; align-self: flex-start; border-bottom-left-radius: 5px; }
  .bub.me { background: #1f8bff; align-self: flex-end; border-bottom-right-radius: 5px; transform-origin: right bottom; }
  .bub.typing { display: flex; gap: 5px; padding: 12px 14px; }
  .bub.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9a9aa2; display: block; }
  .chat .inp { position: absolute; bottom: 18px; left: 12px; right: 12px; height: 32px; border-radius: 16px; border: 1px solid #2c2c33;
               font: 600 11px/30px 'Montserrat'; color: #66666e; padding-left: 14px; }

  .choice h1 { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font: 900 34px 'Montserrat'; color: #fff; letter-spacing: .5px; }
  .pill { position: absolute; font: 900 13px 'Montserrat'; color: #fff; padding: 6px 14px; border-radius: 20px; letter-spacing: .6px; }

  .end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1a1e3d, #0b0d1c 70%); text-align: center; color: #fff; }
  .end .s { font: 500 11px 'JetBrains Mono'; letter-spacing: 4px; color: #9aa0b8; margin-top: 18px; }
  .end .p { font: 900 112px/1 'Montserrat'; color: #ff3b30; margin-top: 8px; letter-spacing: -1px; }
  .end .h { font: 800 17px 'Montserrat'; letter-spacing: 3px; margin-top: 6px; }
  .end .f { display: inline-block; margin-top: 22px; border: 2px solid #fff; border-radius: 22px; padding: 8px 20px; font: 800 13px 'Montserrat'; letter-spacing: 1.5px; }
  .end .q { font: italic 800 17px 'Montserrat'; color: #ffc21f; margin-top: 22px; }
</style></head>
<body><div id="stage"><div id="scene"></div><div id="fx"></div><div id="grain"></div><div id="overlay"></div></div>
<script>
let TL, GRAIN = [];
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const outBack = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const noise = (t, s = 1) => Math.sin(t * 12.9898 * s + 78.233) * Math.sin(t * 3.17 * s + 1.3);

window.setup = (tl) => {
  TL = tl;
  for (let i = 0; i < 6; i++) {               // Film-Grain vorberechnen
    const c = document.createElement('canvas'); c.width = 270; c.height = 480;
    const g = c.getContext('2d'), d = g.createImageData(270, 480);
    for (let p = 0; p < d.data.length; p += 4) { const v = Math.random() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
    g.putImageData(d, 0, 0); GRAIN.push(c.toDataURL());
  }
};

/* ------------------------------------------------ Zeichen-Bausteine (SVG) */
const DEFS = `<defs>
  <radialGradient id="headG" cx="42%" cy="34%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3e9ff"/><stop offset="1" stop-color="#aab7e8"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a9c8ff" stop-opacity=".55"/><stop offset="1" stop-color="#a9c8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#ffb35a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></radialGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2350"/><stop offset="1" stop-color="#141937"/></linearGradient>
  <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6fc0"/><stop offset="1" stop-color="#26316e"/></linearGradient>
  <linearGradient id="blanket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34418f"/><stop offset="1" stop-color="#1f2864"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b2049"/><stop offset="1" stop-color="#151a3c"/></linearGradient>
  <linearGradient id="lit" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bcd4ff" stop-opacity=".45"/><stop offset=".6" stop-color="#bcd4ff" stop-opacity="0"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
</defs>`;

function head(cx, cy, r, o = {}) {
  const ink = '#11142a';
  let eyes = o.eyes || 'open';
  if (eyes !== 'closed' && o.t !== undefined && (o.t % 3.7) < 0.11) eyes = 'closed';   // Blinzeln
  const lx = (o.look || 0) * r * 0.09, ex = r * 0.3, ey = cy - r * 0.04, er = Math.max(2.4, r * (eyes === 'wide' ? 0.085 : 0.07));
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#headG)"/>`;
  if (o.lit) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#lit)"/>`;
  if (eyes === 'closed') {
    for (const sx of [-1, 1]) s += `<path d="M${cx + sx * ex - er * 1.7} ${ey} Q${cx + sx * ex} ${ey + er * 1.8} ${cx + sx * ex + er * 1.7} ${ey}" stroke="${ink}" stroke-width="${Math.max(2, r * 0.03)}" fill="none" stroke-linecap="round"/>`;
  } else {
    for (const sx of [-1, 1]) {
      s += `<circle cx="${cx + sx * ex + lx}" cy="${ey}" r="${er}" fill="${ink}"/>`;
      if (eyes === 'wide') s += `<circle cx="${cx + sx * ex + lx + er * .35}" cy="${ey - er * .35}" r="${er * .32}" fill="#9fd8ff"/>`;
    }
  }
  const my = cy + r * 0.32;
  if (o.mouth === 'o') s += `<ellipse cx="${cx + lx * .5}" cy="${my}" rx="${r * 0.055}" ry="${r * 0.04}" fill="${ink}"/>`;
  else if (o.mouth !== 'none') s += `<path d="M${cx - r * .07} ${my} Q${cx} ${my - r * .025} ${cx + r * .07} ${my}" stroke="${ink}" stroke-width="${Math.max(1.8, r * .025)}" fill="none" stroke-linecap="round"/>`;
  return s;
}

/* ------------------------------------------------ Szenen */
/* Figur mit Körper: Shirt, Strich-Arme (Gummi-Arme als Kurven) */
const SKIN = '#e3e9ff', SHIRT = '#7c3347', SHIRT_HI = '#94405a';
const rot = (p, c, a) => { const s = Math.sin(a), co = Math.cos(a); const x = p[0] - c[0], y = p[1] - c[1]; return [c[0] + x * co - y * s, c[1] + x * s + y * co]; };
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
function arm(s, h, bend = 1) {
  const mx = (s[0] + h[0]) / 2, my = (s[1] + h[1]) / 2, dx = h[0] - s[0], dy = h[1] - s[1], L = Math.hypot(dx, dy) || 1;
  const off = Math.min(26, L * 0.28) * bend;
  const c = [mx - dy / L * off, my + dx / L * off];
  return `<path d="M${s[0]} ${s[1]} Q${c[0]} ${c[1]} ${h[0]} ${h[1]}" stroke="${SKIN}" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="${h[0]}" cy="${h[1]}" r="7" fill="${SKIN}"/>`;
}
function torso(cx, top, w, h) {
  return `<path d="M${cx - w / 2 + 8} ${top} Q${cx} ${top - 8} ${cx + w / 2 - 8} ${top} Q${cx + w / 2 + 4} ${top + 6} ${cx + w / 2} ${top + 26} L${cx + w / 2 - 6} ${top + h} L${cx - w / 2 + 6} ${top + h} L${cx - w / 2} ${top + 26} Q${cx - w / 2 - 4} ${top + 6} ${cx - w / 2 + 8} ${top} Z" fill="${SHIRT}"/>
          <path d="M${cx - 16} ${top - 2} Q${cx} ${top + 12} ${cx + 16} ${top - 2}" stroke="${SHIRT_HI}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
}
function handyHeld(p, lit, flick) {
  return `<g transform="translate(${p[0]} ${p[1]})"><rect x="-16" y="-27" width="32" height="54" rx="7" fill="#07080f"/>
    ${lit ? `<rect x="-16" y="-27" width="32" height="54" rx="7" fill="none" stroke="#bcd4ff" stroke-width="1.5" opacity="${.6 * flick}"/>` : ''}</g>`;
}

function sceneRoom(t, sh) {
  const L = sh.lineTimes, T1 = L.length > 1 ? L[1][0] : 1e9;
  const awake = t > L[0][0] + (L[0][1] - L[0][0]) * 0.55;
  const lit = t >= T1;
  const k = t - T1;
  const vib = lit && ((k >= 0 && k < .32) || (k >= .44 && k < .76));          // synchron zum Buzz-Sound
  const flick = lit ? 0.85 + 0.15 * Math.abs(noise(t * 3)) : 0;
  const sit = ease((k - 0.35) / 0.6);                    // aufsetzen
  const lean = ease((k - 0.75) / 0.4) - ease((k - 1.45) / 0.45);  // zum Nachttisch lehnen
  const reach = ease((k - 0.85) / 0.4);                  // Hand zum Handy
  const back = ease((k - 1.45) / 0.5);                   // Handy zum Gesicht
  const grabbed = k >= 1.3;

  const hip = [270, 585], dy = (1 - sit) * 78, ang = -0.42 * lean;
  const P = (x, y) => rot([x, y + dy], hip, ang);
  const headC = P(270, 402), shL = P(236, 466), shR = P(304, 466);
  const phoneDesk = [72 + (vib ? noise(t * 40) * 2.2 : 0), 519];
  const holdC = [270, 488];
  const restL = [226, 568], restR = [314, 568];
  let handL, handR, phonePos = null;
  handL = lerp2(lerp2(restL, [phoneDesk[0] + 4, phoneDesk[1] - 2], reach), [holdC[0] - 14, holdC[1] + 16], back);
  handR = lerp2(restR, [holdC[0] + 14, holdC[1] + 16], back);
  if (grabbed) phonePos = lerp2([handL[0] + 6, handL[1] - 10], holdC, back);
  const look = !awake ? 0 : (lit && back < .5 ? -1.3 * ease(k / .3) : 0);
  const faceLit = grabbed && back > .4;

  let deskPhone = '';
  if (!grabbed) {
    deskPhone = `<rect x="${phoneDesk[0] - 18}" y="${phoneDesk[1] - 4}" width="36" height="8" rx="3" fill="#07080f"/>`;
    if (lit) deskPhone = `<ellipse cx="${phoneDesk[0]}" cy="${phoneDesk[1] - 6}" rx="70" ry="44" fill="url(#glow)" opacity="${flick}"/>
       <rect x="${phoneDesk[0] - 16}" y="${phoneDesk[1] - 5}" width="32" height="3" rx="1.5" fill="#d7e6ff" opacity="${flick}"/>` + deskPhone;
    if (vib) deskPhone += `<path d="M${phoneDesk[0] - 26} ${phoneDesk[1] - 10} l-5 -5 M${phoneDesk[0] + 26} ${phoneDesk[1] - 10} l5 -5 M${phoneDesk[0] - 29} ${phoneDesk[1]} l-7 0 M${phoneDesk[0] + 29} ${phoneDesk[1]} l7 0" stroke="#d7e6ff" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  const torsoSvg = `<g transform="rotate(${ang * 180 / Math.PI} ${hip[0]} ${hip[1]}) translate(0 ${dy + (1 - sit) * 34})">${torso(270, 448, 94, 150)}</g>`;

  return `<svg viewBox="0 0 540 960">${DEFS}
    <rect width="540" height="960" fill="url(#wall)"/>
    <rect y="770" width="540" height="190" fill="#0f1229"/><rect y="768" width="540" height="4" fill="#232a58"/>
    <rect x="40" y="165" width="150" height="180" rx="6" fill="#111536"/>
    <rect x="50" y="175" width="130" height="160" rx="3" fill="url(#win)"/>
    <circle cx="150" cy="212" r="16" fill="#dfe7ff" opacity=".85"/>
    <rect x="112" y="175" width="6" height="160" fill="#111536"/><rect x="50" y="252" width="130" height="6" fill="#111536"/>
    <polygon points="50,335 180,335 330,770 140,770" fill="#8aa2ff" opacity=".05"/>
    <rect x="25" y="155" width="30" height="210" rx="8" fill="#252c62"/><rect x="175" y="155" width="30" height="210" rx="8" fill="#252c62"/>
    <rect x="424" y="290" width="112" height="480" rx="3" fill="#0e1230"/>
    <rect x="432" y="298" width="100" height="472" fill="url(#door)"/>
    <rect x="446" y="320" width="74" height="170" rx="3" fill="none" stroke="#21275a" stroke-width="3"/>
    <rect x="446" y="520" width="74" height="220" rx="3" fill="none" stroke="#21275a" stroke-width="3"/>
    <rect x="438" y="530" width="20" height="5" rx="2" fill="#5a628f"/>
    <rect x="22" y="524" width="104" height="246" rx="6" fill="#1a1f47"/><rect x="18" y="520" width="112" height="12" rx="4" fill="#262d5e"/>
    <rect x="34" y="570" width="80" height="4" rx="2" fill="#141838"/>
    <rect x="102" y="482" width="8" height="38" fill="#2b3264"/><path d="M86 486 L126 486 L118 452 L94 452 Z" fill="#2e3670"/>
    ${deskPhone}
    <rect x="140" y="380" width="260" height="170" rx="34" fill="#262d60"/>
    <rect x="132" y="540" width="276" height="230" rx="22" fill="#1d2353"/>
    <ellipse cx="270" cy="494" rx="104" ry="36" fill="#b3bde6"/>
    ${faceLit ? `<circle cx="${holdC[0]}" cy="${holdC[1] - 20}" r="190" fill="url(#glow)" opacity="${flick}"/>` : ''}
    ${torsoSvg}
    ${head(headC[0], headC[1], 46, { eyes: awake ? 'open' : 'closed', t, lit: faceLit, look })}
    <path d="M118 ${560 - 0} Q270 ${528} 422 560 L432 905 Q270 930 108 905 Z" fill="url(#blanket)"/>
    <path d="M160 640 Q210 630 240 660 M330 675 Q380 640 410 660 M150 800 Q250 780 330 820" stroke="#4352a6" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>
    ${sit > 0.02 ? `<g opacity="${clamp(sit * 3)}">${arm(shR, handR, -1)}${arm(shL, handL, 1)}</g>` : ''}
    ${phonePos ? handyHeld(phonePos, true, flick) : ''}
    ${sit > 0.02 && phonePos ? `<circle cx="${handL[0]}" cy="${handL[1]}" r="7" fill="${SKIN}"/><circle cx="${handR[0]}" cy="${handR[1]}" r="7" fill="${SKIN}"/>` : ''}
  </svg>`;
}

function sceneFace(t, sh) {
  const lt = t - sh.start, d = sh.end - sh.start;
  const look = lt > d * 0.55 ? Math.sin(Math.min(1, (lt - d * .55) * 3) * Math.PI / 2) * 1.2 : 0;
  const tr = 1.2 * noise(t * 9);
  return `<svg viewBox="0 0 540 960">${DEFS}
    <rect width="540" height="960" fill="#151a3c"/>
    <rect x="-20" y="80" width="580" height="560" rx="60" fill="#262d60"/>
    <ellipse cx="270" cy="560" rx="380" ry="170" fill="#a9b3df"/>
    <path d="M10 960 L30 700 Q60 610 170 600 Q270 640 370 600 Q480 610 510 700 L530 960 Z" fill="${SHIRT}"/>
    <path d="M200 612 Q270 660 340 612" stroke="${SHIRT_HI}" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g transform="translate(${tr} ${tr * .6})">${head(272, 380, 225, { eyes: 'wide', mouth: 'o', look, lit: true })}</g>
    <circle cx="270" cy="1000" r="400" fill="url(#glow)"/>
    <path d="M-40 850 Q270 800 580 850 L580 980 L-40 980 Z" fill="url(#blanket)"/>
    <rect x="200" y="842" width="140" height="160" rx="22" fill="#07080f"/>
    <rect x="200" y="842" width="140" height="160" rx="22" fill="none" stroke="#bcd4ff" stroke-width="2" opacity=".5"/>
    <path d="M150 990 Q170 900 196 880 M390 990 Q370 900 344 880" stroke="${SKIN}" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="198" cy="880" r="17" fill="${SKIN}"/><circle cx="342" cy="880" r="17" fill="${SKIN}"/>
  </svg>`;
}

function sceneDoor(t, sh) {
  let dx = 0, flash = 0;
  for (const k of TL.knocks) { const a = t - k; if (a >= 0 && a < 0.16) { dx += Math.sin(a * 90) * 4 * (1 - a / 0.16); flash = Math.max(flash, 1 - a / 0.16); } }
  let ang = 0;
  if (TL.handle.length) { const [h0, h1] = TL.handle; const p = ease((t - h0 - 0.3) / (h1 - h0 - 0.3)); ang = 32 * p + (p > 0 && p < 1 ? noise(t * 20) * 1.5 : 0); }
  const feet = `<rect x="215" y="806" width="34" height="6" fill="#0d1027"/><rect x="292" y="806" width="34" height="6" fill="#0d1027"/>`;
  return `<svg viewBox="0 0 540 960">${DEFS}
    <rect width="540" height="960" fill="url(#wall)"/>
    <rect y="812" width="540" height="148" fill="#0e1128"/>
    <ellipse cx="270" cy="815" rx="190" ry="70" fill="url(#warm)"/>
    <g transform="translate(${dx} 0)">
      <rect x="126" y="136" width="288" height="676" rx="4" fill="#0c1030"/>
      <rect x="140" y="150" width="260" height="656" fill="url(#door)"/>
      <rect x="166" y="180" width="208" height="250" rx="4" fill="none" stroke="#232a5e" stroke-width="5"/>
      <rect x="166" y="470" width="208" height="300" rx="4" fill="none" stroke="#232a5e" stroke-width="5"/>
      <circle cx="362" cy="505" r="13" fill="#3a4176"/>
      <g transform="rotate(${-ang} 362 505)"><rect x="300" y="499" width="64" height="12" rx="6" fill="#7a83b6"/><rect x="300" y="499" width="64" height="4" rx="2" fill="#a3abd8"/></g>
      <rect x="150" y="806" width="240" height="6" fill="#ffbe6a"/>${feet}
    </g>
    <path d="M-20 905 Q270 860 560 905 L560 980 L-20 980 Z" fill="url(#blanket)"/>
    ${flash ? `<rect width="540" height="960" fill="#000" opacity="${flash * .25}"/>` : ''}
  </svg>`;
}

function phoneBox(x, y, w, h, inner, armW = 58) {
  return `<div class="arm" style="left:${x + w / 2 - armW / 2}px;top:${y + h - 30}px;width:${armW}px;height:${960 - y - h + 60}px"></div>
    <div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <div class="btn" style="left:-7px;top:110px;height:30px"></div><div class="btn" style="left:-7px;top:160px;height:52px"></div>
      <div class="btn" style="right:-7px;top:140px;height:70px"></div>
      <div class="screen"><div class="island"></div>${inner}</div></div>`;
}

const phoneBg = `<svg viewBox="0 0 540 960">${DEFS}<rect width="540" height="960" fill="#121633"/>
  <g filter="url(#blur18)" opacity=".8"><rect x="20" y="180" width="160" height="190" fill="#2c3878"/><rect x="380" y="280" width="140" height="480" fill="#1b2050"/>
  <ellipse cx="270" cy="760" rx="260" ry="140" fill="#26306e"/></g></svg>`;

function sceneLock(t, sh) {
  const lt = t - sh.start, p = outBack((lt - 0.15) / 0.35);
  const n = sh.notif;
  return phoneBg + phoneBox(118, 150, 304, 620, `<div class="lock"><div class="d">Donnerstag, 5. November</div><div class="c">${sh.clock}</div>
    <div class="notif" style="opacity:${clamp(p)};transform:translateY(${(1 - p) * -18}px) scale(${.9 + .1 * p})"><div class="ic"></div>
    <div style="flex:1"><div class="n">${n.from}<span>jetzt</span></div><div class="m">${n.text}</div></div></div></div>`);
}

function sceneChat(t, sh) {
  let list = '';
  for (const m of TL.msgs) {
    if (m.t > t) continue;
    const p = outBack((t - m.t) / 0.22);
    list += `<div class="bub ${m.from}" style="transform:scale(${.6 + .4 * p});opacity:${clamp(p * 1.5)}">${m.text}</div>`;
  }
  for (const [a, b] of TL.typing) if (t >= a && t < b) {
    const dots = [0, 1, 2].map(i => `<i style="opacity:${.35 + .65 * Math.max(0, Math.sin((t * 6 - i * .7)))}"></i>`).join('');
    list += `<div class="bub them typing">${dots}</div>`;
  }
  return phoneBg + phoneBox(118, 150, 304, 620, `<div class="chat">
    <div class="sbar"><span>${sh.clock}</span><span class="bat"><b></b></span></div>
    <div class="hd"><div class="av">${sh.contact[0]}</div><div class="nm">${sh.contact} ›</div></div>
    <div class="day">Heute ${sh.clock}</div><div class="list">${list}</div>
    <div class="inp">iMessage</div></div>`);
}

function miniChat(text, x, label, color, p) {
  return `<div style="opacity:${clamp(p)};transform:translateY(${(1 - p) * 20}px)">
    <div class="pill" style="left:${x + 100}px;top:228px;transform:translateX(-50%);background:${color}">${label}</div>
    <div class="phone" style="left:${x}px;top:272px;width:200px;height:400px;border-radius:34px;padding:7px">
    <div class="screen" style="border-radius:28px"><div class="island" style="width:62px;height:18px;top:8px"></div>
    <div class="chat"><div class="hd" style="top:30px"><div class="av" style="width:30px;height:30px;font-size:13px;line-height:30px">M</div><div class="nm" style="font-size:9px">Mama ›</div></div>
    <div class="list" style="padding-top:112px;padding-left:9px;padding-right:9px"><div class="bub them" style="font-size:11.5px;max-width:90%">${text}</div></div></div></div></div></div>`;
}

function sceneChoice(t, sh) {
  const lt = t - sh.start;
  return `<svg viewBox="0 0 540 960">${DEFS}<rect width="540" height="960" fill="#0f1230"/><ellipse cx="270" cy="960" rx="300" ry="160" fill="url(#warm)" opacity=".5"/></svg>
    <div class="choice"><h1 style="opacity:${clamp(lt / .25)}">WEM GLAUBST DU?</h1>
    ${miniChat(sh.left, 40, 'NACHRICHT 1', '#2f7cf6', outBack((lt - .15) / .35))}
    ${miniChat(sh.right, 300, 'NACHRICHT 2', '#ff3b30', outBack((lt - .45) / .35))}</div>`;
}

function sceneEnd(t, sh) {
  const lt = t - sh.start, a = (d) => `opacity:${clamp((lt - d) / .3)};transform:translateY(${(1 - ease((lt - d) / .3)) * 14}px)`;
  const door = `<svg viewBox="0 0 200 150" width="200" height="150" style="display:block;margin:0 auto">
    <rect x="50" y="10" width="100" height="128" fill="#181d45" stroke="#0b0f2c" stroke-width="5"/>
    <circle cx="136" cy="78" r="4" fill="#7a83b6"/><rect x="52" y="134" width="96" height="4" fill="#ffbe6a"/>
    <rect x="78" y="134" width="12" height="4" fill="#0d1027"/><rect x="108" y="134" width="12" height="4" fill="#0d1027"/></svg>`;
  return `<div class="end"><div style="margin-top:205px;${a(0)}">${door}</div>
    <div class="s" style="${a(.1)}">${TL.title}</div><div class="p" style="${a(.2)}">TEIL ${TL.part + 1}</div>
    <div class="h" style="${a(.35)}">HEUTE NACHT</div><div style="${a(.5)}"><span class="f">FOLGE FÜR TEIL ${TL.part + 1}</span></div>
    <div class="q" style="${a(.7)}">1 oder 2? Schreib's in die Kommentare.</div></div>`;
}

const SCENES = { room: sceneRoom, face: sceneFace, door: sceneDoor, lock: sceneLock, chat: sceneChat, choice: sceneChoice, end: sceneEnd };
const ZOOM = { room: [1.0, 1.05, '40% 55%'], face: [1.04, 1.12, '50% 45%'], door: [1.0, 1.07, '50% 70%'],
               handle: [1.75, 1.95, '67% 52.6%'], lock: [1.0, 1.03, '50% 50%'], chat: [1.0, 1.03, '50% 50%'],
               choice: [1.0, 1.02, '50% 50%'], end: [1, 1, '50% 50%'] };

/* ------------------------------------------------ Frame */
window.renderFrame = (t) => {
  const sh = TL.shots.find(s => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  const lt = t - sh.start, d = sh.end - sh.start;
  const z = ZOOM[sh.zoom || sh.scene];
  const sc = $('scene');
  sc.innerHTML = SCENES[sh.scene](t, sh);
  let shake = '';
  for (const k of TL.knocks) { const a = t - k; if (a >= 0 && a < .18) shake = `translate(${Math.sin(a * 80) * 3 * (1 - a / .18)}px, ${Math.cos(a * 70) * 2 * (1 - a / .18)}px) `; }
  sc.style.transformOrigin = z[2];
  sc.style.transform = shake + `scale(${z[0] + (z[1] - z[0]) * ease(lt / d * .9 + .05)})`;

  let ov = '';
  if (t < 3.0) {
    ov += `<div class="title" style="opacity:${clamp((3.0 - t) / .25)}"><div class="k">${TL.series} · ${TL.episode}</div><div class="t">${TL.title}<br>TEIL ${TL.part}</div></div>`;
  } else if (sh.place && ['room', 'face', 'door'].includes(sh.scene)) {
    const blink = (t % 1.2) < .7 ? 1 : .25;
    ov += `<div class="badge"><div class="tm"><i style="opacity:${blink}"></i>${sh.clock}<small>UHR</small></div><div class="pl">TEIL ${TL.part} · ${sh.place}</div></div>`;
  }
  const g = TL.groups.find(g => t >= g.start && t < g.end);
  if (g) {
    const top = sh.scene === 'choice' ? 720 : 568;
    const ws = g.words.map(i => TL.words[i]).filter(w => w.t <= t + 0.02);
    const last = ws.length - 1;
    ov += `<div class="cap" style="top:${top}px">` + ws.map((w, i) => {
      const p = i === last ? outBack((t - w.t) / .12) : 1;
      return `<span class="${w.c}" style="transform:scale(${.8 + .2 * p})">${w.w}</span>`;
    }).join('') + `</div>`;
  }
  $('overlay').innerHTML = ov;
  $('grain').style.backgroundImage = `url(${GRAIN[Math.floor(t * 24) % GRAIN.length]})`;
};
</script></body></html>
