<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --acc: #00ff88; --acc2: #ffd400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05070d;
    font-family: 'Inter Display', 'Inter', 'Noto Color Emoji', sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; }
  #stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; display: none; }
  .inner { position: absolute; inset: 0; }
  .hl { color: var(--acc); }
  .center { position: absolute; left: 60px; right: 60px; top: 200px; bottom: 420px; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { display: inline-block; padding: 14px 34px; border-radius: 999px; background: var(--acc); color: #05070d;
    font-weight: 900; font-size: 44px; letter-spacing: 3px; text-transform: uppercase; }
  .pill.ghost { background: rgba(255,255,255,.08); color: #fff; border: 3px solid var(--acc); }
  .hookline { display: inline-block; white-space: nowrap; font-weight: 900; font-size: 170px; line-height: 1.02;
    text-transform: uppercase; letter-spacing: -3px; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .lnwrap { margin: 4px 0; }
  .bar { height: 14px; border-radius: 7px; background: var(--acc); margin-top: 34px; width: 0;
    box-shadow: 0 0 30px var(--acc); }
  .sub { margin-top: 34px; font-size: 52px; font-weight: 700; color: rgba(255,255,255,.85); max-width: 900px; line-height: 1.2; }

  /* rank */
  .ranknum { position: absolute; top: 200px; left: 50px; font-weight: 900; font-size: 480px; line-height: 1;
    color: transparent; -webkit-text-stroke: 7px var(--acc); letter-spacing: -20px;
    filter: drop-shadow(0 0 30px var(--acc)); }
  .ranktag { position: absolute; top: 380px; right: 70px; }
  .col { position: absolute; left: 70px; right: 70px; top: 800px; display: flex; flex-direction: column; gap: 10px; }
  .rname { display: inline-block; white-space: nowrap; font-weight: 900; font-size: 100px; line-height: 1.05;
    text-transform: uppercase; letter-spacing: -2px; }
  .rname.small { font-size: 78px; }
  .rmeta { font-size: 40px; font-weight: 600; color: rgba(255,255,255,.65); letter-spacing: 1px; margin-bottom: 14px; }
  .rvalue { margin-top: 26px; display: flex; align-items: baseline; gap: 22px; }
  .vnum { font-weight: 900; font-size: 190px; line-height: .9; color: var(--acc); text-shadow: 0 0 40px var(--acc); }
  .vunit { font-weight: 800; font-size: 54px; text-transform: uppercase; letter-spacing: 2px; }
  .icons { display: flex; gap: 14px; margin-top: 24px; }
  .icons svg { width: 100px; height: 100px; filter: drop-shadow(0 6px 18px rgba(255,200,0,.45)); }
  .rbar { margin-top: 30px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.1); overflow: hidden; }
  .rbar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); border-radius: 22px; }

  /* poll */
  .stmt { font-weight: 900; font-size: 92px; line-height: 1.12; margin-top: 50px; max-width: 940px; }
  .stmt span { display: inline-block; margin: 0 12px; }
  .choices { display: flex; align-items: center; gap: 0; margin-top: 90px; position: relative; }
  .choice { width: 410px; height: 230px; border-radius: 36px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; font-weight: 900; font-size: 54px; letter-spacing: 2px; }
  .choice svg { width: 90px; height: 90px; }
  .choice.a { background: linear-gradient(160deg, #1ee87c, #0a9a4c); box-shadow: 0 20px 60px rgba(30,232,124,.35); }
  .choice.b { background: linear-gradient(160deg, #ff4d6a, #b3122f); box-shadow: 0 20px 60px rgba(255,59,92,.35); }
  .vs { width: 150px; height: 150px; margin: 0 -25px; z-index: 2; position: relative; }
  .vs svg { position: absolute; inset: 0; }
  .vs b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 900; }
  .cta { margin-top: 60px; font-size: 46px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

  /* story */
  .big { position: absolute; left: 40px; right: 40px; top: 330px; text-align: center; font-weight: 900; font-size: 270px;
    line-height: 1; color: var(--acc); text-shadow: 0 0 60px var(--acc); white-space: nowrap; letter-spacing: -6px; }
  .biglabel { position: absolute; left: 60px; right: 60px; top: 640px; text-align: center; font-size: 50px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 4px; color: rgba(255,255,255,.85); }
  .simg { position: absolute; left: 90px; right: 90px; top: 260px; height: 640px; border-radius: 40px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6); border: 4px solid var(--acc); }
  .simg img { width: 100%; height: 100%; object-fit: cover; }
  .stag { position: absolute; top: 210px; left: 0; right: 0; text-align: center; }
  .cap { position: absolute; left: 50px; right: 50px; text-align: center; font-weight: 900; font-size: 98px; line-height: 1.15;
    text-transform: uppercase; letter-spacing: -1px; }
  .cap span { display: inline-block; margin: 0 14px; paint-order: stroke; -webkit-text-stroke: 14px #000;
    text-shadow: 0 10px 30px rgba(0,0,0,.8); }
  .cap span.on { color: var(--acc2); }
  .cap span.k { color: var(--acc); }

  /* quiz */
  .qtitle { position: absolute; top: 230px; left: 0; right: 0; text-align: center; }
  .qtitle .hookline { font-size: 104px; }
  .qchip { position: absolute; top: 380px; left: 0; right: 0; text-align: center; }
  .qlist { position: absolute; left: 90px; right: 90px; top: 520px; }
  .qline { position: absolute; left: 33px; top: 40px; width: 6px; background: var(--acc); border-radius: 3px; height: 0;
    box-shadow: 0 0 20px var(--acc); }
  .qrow { position: relative; height: 88px; display: flex; align-items: center; gap: 30px; }
  .qdot { width: 72px; height: 72px; border-radius: 50%; background: #05070d; border: 6px solid var(--acc);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 32px; flex: none; }
  .qclub { font-weight: 900; font-size: 56px; text-transform: uppercase; letter-spacing: -1px; flex: 1; white-space: nowrap; }
  .qyears { font-weight: 700; font-size: 38px; color: rgba(255,255,255,.6); }
  .timer { position: absolute; left: 50%; top: 1460px; width: 170px; height: 170px; margin-left: -85px; }
  .timer svg { position: absolute; inset: 0; }
  .timer b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 84px; font-weight: 900; }

  /* reveal */
  .rays { position: absolute; left: 50%; top: 45%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.07) 0deg 7deg, transparent 7deg 18deg);
    border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 0, transparent 60%); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .follow { margin-top: 70px; display: inline-flex; align-items: center; gap: 18px; padding: 28px 70px; border-radius: 999px;
    background: #fe2c55; font-weight: 900; font-size: 64px; letter-spacing: 2px; box-shadow: 0 20px 60px rgba(254,44,85,.5); }
  .handle { margin-top: 30px; font-size: 48px; font-weight: 700; color: rgba(255,255,255,.75); }

  #brand { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 30px;
    letter-spacing: 8px; color: rgba(255,255,255,.45); }
  #progress { position: absolute; top: 0; left: 0; height: 10px; background: var(--acc); box-shadow: 0 0 20px var(--acc); }
  #swipe { position: absolute; top: -200px; height: 2320px; width: 1500px; left: 0; background: var(--acc); display: none;
    box-shadow: 0 0 0 60px var(--acc2); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gold" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff7cf"/><stop offset=".35" stop-color="#ffd34d"/><stop offset="1" stop-color="#8a5a00"/>
    </radialGradient>
  </defs>
</svg>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="stage"></div>
<div id="brand"></div>
<div id="progress"></div>
<div id="swipe"></div>
<script src="engine.js"></script>
</body>
</html>
